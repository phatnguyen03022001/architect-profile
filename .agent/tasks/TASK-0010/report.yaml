ownership_boundary:
  finding: >-
    The five-repository split is already explicit: architect-profile owns operator-specific bootstrap/judgment; agent-skills owns work governance; agent-standards owns engineering/evidence properties; agent-documents owns documentation closure/ownership; agent-runtime owns optional local execution implementation. External one-file packaging cannot replace or merge these authorities.
  duplicate_doctrine_rule: >-
    More concise external wording is not an improvement when current canonical semantics already protect the behavior. Existing narrow owners remain authoritative.

candidate_patterns:
  - id: KP-1
    name: mutation_traceability
    classification: ALREADY_OWNED
    narrowest_owner: "agent-skills: executor/SKILL.md + protocols/TASK_PROTOCOL.md"
    evidence:
      - >-
        Executor is bound to one approved task revision, repository, branch, and exact base; pre-mutation gates verify task identity, structure authority, and every intended Git mutation against task authority.
      - >-
        Restrictive execution permits only authorized scope and forbids unrelated cleanup, adjacent fixes, speculative work, architecture/spec drift, unauthorized dependencies, structural reorganization, and while-I-am-here refactors.
      - >-
        Task Protocol already binds generated/task work to traceability references, acceptance references, required evidence, exact task authority, and gate-scoped minimum evidence.
    gap_test: >-
      A stronger slogan such as objective -> scope -> evidence does not add a reproduced protection missing from the current binding/scope/evidence chain. No wrong mutation, operator intervention, unnecessary work, or weaker evidence was reproduced from its absence as wording.

  - id: KP-2
    name: goal_evidence_framing
    classification: ALREADY_OWNED
    narrowest_owner: "agent-skills: protocols/TASK_PROTOCOL.md and canonical task/report model"
    evidence:
      - >-
        Current governance separates objective/authority from acceptance evidence, requires exact acceptance/evidence obligations, and lets Executor choose implementation detail only inside the approved boundary.
      - >-
        Evidence gathering is explicitly gate-scoped and stops after material predicates are proven; risk-proportional lanes vary rigor without manufacturing ceremony.
      - >-
        The report contract requires acceptance evidence and required checks rather than a vague make-it-work claim.
    gap_test: >-
      Declarative success criteria are already materially represented. A blanket preference against procedural task detail would be unsafe because exact step constraints are sometimes necessary for migrations, destructive boundaries, verification binding, or other high-assurance work.

  - id: KP-3
    name: behavioral_compression
    classification: ALREADY_OWNED
    narrowest_owner: "architect-profile: README.md + ARCHITECT_PROFILE.md + ARCHITECT_CALIBRATION.md"
    evidence:
      - >-
        Fresh bootstrap already starts with a compact five-repository system map, then ARCHITECT_PROFILE, then calibration only for material judgment, then target truth and only the deeper canonical artifacts required by the current task.
      - >-
        The profile explicitly optimizes bounded context and the calibration file exists to transfer compact reviewed cross-target judgment without chat history.
      - >-
        agent-skills README is discovery/navigation and explicitly refuses to become a second normative protocol.
    gap_test: >-
      External brevity does not prove current bootstrap is too large or ambiguous. TASK-0008 records three fresh phone-only Architect trials converging materially across state resolution, review priority, audit scope, capability route, operator escalation, mutation boundary, and lifecycle decision without a mega-summary.

  - id: KP-4
    name: observable_behavior_over_doctrine_count
    classification: ALREADY_OWNED
    narrowest_owner: "architect-profile calibration plus repository-local task/report/review evidence"
    evidence:
      - >-
        TASK-0008 already evaluates observable outcomes across three fresh trials: exact-state resolution, scope discipline, capability route, operator escalation, mutation boundary, lifecycle decision, and material convergence.
      - >-
        ARCHITECT_CALIBRATION defines handoff-loss success as fewer reconstruction questions and avoidance of recurring mistakes, while explicitly stating that no benchmark harness, scoring system, CI, or automation is required.
      - >-
        ARCHITECT_PROFILE cost/resource guardrails already reject repeated broad scans, duplicate queries, CI-as-debugger behavior, unnecessary reruns, and paid/limited-resource waste.
    signal_boundary:
      scope_discipline: "Already observable from task scope, changed-file evidence, audit boundaries, and review lineage."
      operator_intervention: "Already observable from explicit operator-escalation decisions and authority-required outcomes."
      evidence_sufficiency: "Already observable from acceptance_evidence, executor_checks, review evidence, and exact lineage."
      tool_or_ci_waste: "Already reviewable from concrete execution/report evidence when relevant; no persistent telemetry is justified."
      revision_churn: "Repository task revisions/history can be inspected when a concrete audit needs it; no current reproduced problem justifies a persistent KPI or scoring layer."
    gap_test: >-
      The system already judges behavior from real evidence when there is a decision-relevant audit. No reproduced failure shows that persistent scoring, telemetry, benchmark infrastructure, or a new doctrine layer would improve outcomes.

explicit_mismatch_disposition:
  ask_human_first_uncertainty:
    decision: REJECT_FOR_THIS_SYSTEM
    reason: >-
      Current operator profile requires canonical evidence and authorized current tools to be exhausted before escalation. Operator input is reserved for true judgment/authority/user-only action, not resolvable agent uncertainty.
  loc_count_driven_refactoring:
    decision: REJECT_FOR_THIS_SYSTEM
    reason: >-
      Simplicity explicitly states that simplicity is not fewest lines and that existing structure is not an excuse for unrelated reorganization. Concrete requirement/invariant evidence, not line count, admits change.
  universal_tests_first:
    decision: REJECT_FOR_THIS_SYSTEM
    reason: >-
      Tests are one possible verification mechanism, not universal workflow authority. Current governance selects risk-appropriate evidence and preserves exact task acceptance/verification requirements, including cases where tests-first is irrelevant or insufficient.
  drive_by_cleanup:
    decision: REJECT_FOR_THIS_SYSTEM
    reason: >-
      Executor already forbids unrelated cleanup and while-I-am-here refactors. The external reference aligns with that prohibition but adds no new semantic owner or change.
  one_file_authority_collapse:
    decision: REJECT_FOR_THIS_SYSTEM
    reason: >-
      The five repositories are intentionally separated by authority. Collapsing them into CLAUDE.md or an equivalent mega-authority would duplicate/conflict ownership and weaken lazy-loading boundaries.

