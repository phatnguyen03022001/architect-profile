    precedence: 3

structure_authority:
  status: RESOLVED
  source: "ARCHITECT_PROFILE.md existing Context Hygiene and Successor Architect Continuity sections only."
  rationale: "This is an operator-specific provenance/continuity semantic correction. No archive implementation, schema, registry, service, repository, or automation is justified."

objective: "Define a compact three-layer provenance boundary for this operator: raw conversation/prompt history may be preserved as private forensic backup with authority NONE; material user intent, corrections, overrides, and decisions must be distilled into the narrowest canonical target/profile owner before later work relies on them; reusable cross-target architectural judgment may be distilled into calibration under its existing admission rules. Preserve successor bootstrap from canonical repositories rather than raw history and do not claim continuous archival capability that the current ChatGPT+GitHub-only environment cannot prove."

scope:
  required_changes:
    - "Update ARCHITECT_PROFILE.md only with a concise provenance boundary distinguishing L0 RAW, L1 DISTILLED INTENT, and L2 LEARNED JUDGMENT."
    - "Define L0 RAW as optional/private forensic backup of prompts/conversation exports or equivalent source history with authority NONE. Raw history is not target truth, task authority, profile authority, calibration, or normal bootstrap input."
    - "Define L1 DISTILLED INTENT as material user requests, corrections, constraints, overrides, and decisions that affect future work, persisted to the narrowest canonical owner: target repository for target/product truth; architect-profile only for durable operator-specific working preferences; existing task/review/decision artifacts where their current owner already applies."
    - "Define L2 LEARNED JUDGMENT as reviewed, cross-target reusable operator-specific architectural judgment admitted to ARCHITECT_CALIBRATION.md under its existing rules; do not weaken its transcript/secret exclusions."
    - "State that raw archival completeness and canonical engineering completeness are separate. Failure or unavailability of raw archival capture must not be disguised as complete backup and must not silently block otherwise well-grounded target work unless the missing history is materially required to resolve authority or intent."
    - "Preserve raw originals when archival tooling exists; normalization, deduplication, indexing, summarization, or search views must be derived and must not overwrite the forensic source. Do not prescribe a specific backup product in this task."
    - "Keep raw history out of public/canonical governance repositories by default and never persist credentials, secrets, tokens, private account identifiers, or sensitive personal data merely for continuity."
    - "Successor Architect bootstrap remains profile + calibration + applicable agent-* authority + target canonical truth. Raw archive is retrieved only for explicit provenance/reconstruction need, not loaded by default."
    - "Do not promise automatic/continuous capture from ChatGPT consumer UI, do not require browser scraping/extensions, and do not add an archive service or sixth governance repository."
    - "Keep current main-only topology and produce TASK-0005/report.yaml as a separate report-only commit after implementation, then stop at Governing Architect review."

  allowed_existing_files_or_components:
    - ARCHITECT_PROFILE.md
    - .agent/tasks/TASK-0005/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "GitHub canonical target/profile truth outranks raw prompt history."
  - "Raw history has authority NONE and is never a normal bootstrap dependency."
  - "Material target-specific intent belongs to the target repository, not architect-profile."
  - "Calibration remains distilled, compact, operator-specific, cross-target reusable, evidence-derived, and non-transcript."
  - "No new governance repository, archive service, database, registry, queue, daemon, browser scraper, transcript schema, or lifecycle system is introduced."
  - "No claim of archival completeness is made without evidence."
  - "Repository topology remains exactly {main}."

forbidden_changes:
  - "Do not modify ARCHITECT_CALIBRATION.md; its current ownership/admission/hygiene rules are already sufficient."
  - "Do not modify README.md, earlier task/report/review history, agent-skills, agent-documents, agent-standards, agent-runtime, or target repositories."
  - "Do not add raw prompt/chat transcripts, exported conversation payloads, account lists, credentials, secrets, or personal archives to this repository."
  - "Do not select or integrate restic, SOPS, age, cloud storage, email, browser extensions, scraping, export automation, or another archival product in this task."
  - "Do not create a prompt registry, prompt versioning system, vector database, transcript database, ingestion pipeline, synchronization service, or second source of authority."
  - "Do not reinterpret raw history as proof that overrides current explicit user authority or current canonical target truth."
  - "Do not perform unrelated profile cleanup or framework expansion."

