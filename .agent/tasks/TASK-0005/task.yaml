acceptance_criteria:
  - id: AC-1
    requirement: "Raw prompt/history preservation cannot become engineering authority."
    evidence_required: "Profile explicitly defines L0 RAW as forensic/private/non-authoritative and excludes it from normal target truth, task authority, calibration, and bootstrap."
  - id: AC-2
    requirement: "Material user intent has a canonical distillation path."
    evidence_required: "Profile defines L1 and routes target-specific product/design/constraint decisions to target-owned canonical artifacts while keeping durable operator-specific preferences in architect-profile."
  - id: AC-3
    requirement: "Reusable learned judgment remains compact and evolvable."
    evidence_required: "Profile defines L2 as calibration governed by existing admission, evidence, boundary/reversal, revision, deletion, and transcript/secret hygiene semantics without duplicating them."
  - id: AC-4
    requirement: "Forensic preservation does not inflate successor context."
    evidence_required: "Profile keeps raw archive out of default bootstrap and allows retrieval only for explicit provenance/reconstruction need."
  - id: AC-5
    requirement: "The current mobile/ChatGPT+GitHub environment is represented honestly."
    evidence_required: "Profile does not claim continuous consumer-UI capture, automatic exports, local backup tooling, or archival completeness without evidence; no Mac/local capability is made mandatory."
  - id: AC-6
    requirement: "Correction stays minimal and correctly owned."
    evidence_required: "Implementation modifies only ARCHITECT_PROFILE.md; no archive machinery/new repository/schema/tool integration is added; report is separate and topology remains {main}."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh canonical GitHub truth; require main equals exact handoff base and topology exactly {main}; resolve TASK-0005 revision 1 and pinned agent-skills revision; preflight required GitHub-only EXECUTION capabilities."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect current Context Hygiene, Successor Architect Continuity, and ARCHITECT_CALIBRATION.md boundary. Confirm calibration already excludes transcripts/secrets and identify only the missing raw-vs-distilled provenance semantics."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest coherent wording correction in ARCHITECT_PROFILE.md only. Prefer a compact subsection and references to existing canonical owners over duplicated doctrine."
      required: true
    - id: CHECK-4
      command_or_check: "Semantic review against AC-1..AC-5: no raw authority, correct L1 ownership, L2 calibration boundary preserved, no bootstrap inflation, no unsupported continuous-capture claim, no archive product selection."
      required: true
    - id: CHECK-5
      command_or_check: "Before each write refresh main and require exact expected parent. Verify base-to-implementation diff changes only ARCHITECT_PROFILE.md and introduces no transcript/archive artifacts or unrelated cleanup."
      required: true
    - id: CHECK-6
      command_or_check: "Commit/push implementation non-force to main; then create TASK-0005/report.yaml as a separate report-only commit, verify sole parents/exact diffs/final main/topology, and stop at Governing Architect review."
      required: true
