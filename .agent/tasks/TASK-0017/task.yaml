structure_authority:
  status: RESOLVED
  source: "accepted OPM-01 bootstrap structure"
  rationale: "Adapt the existing bootstrap/profile projections in place. OPM-02 must not add a role framework, routing engine, registry, service, schema family, or new lifecycle artifact."

objective: "Materialize the operator-specific OPM-02 correction without duplicating generic governance: keep Architect as ChatGPT, keep all delegated agents/sessions as Executors under pinned agent-skills semantics, update Codex execution routing to LUNA/MEDIUM, preserve exact four-surface routing, and make target binding fail closed instead of relying on stale conversation or local checkout inference."

scope:
  required_changes:
    - "Update the existing machine-readable operator execution routes so CHATGPT_GITHUB and CHATGPT_LOCAL remain GPT-5.6 Sol/HIGH while CODEX_CLOUD and CODEX_LOCAL become exactly LUNA/MEDIUM. Runtime unavailability may block a route but must not silently substitute another model, effort, controller, or surface."
    - "Preserve exactly four execution surfaces: CHATGPT_GITHUB, CHATGPT_LOCAL, CODEX_CLOUD, and CODEX_LOCAL. CHATGPT_LOCAL continues to use AGENT_RUNTIME only as transport; CODEX_LOCAL remains native local execution; CODEX_CLOUD remains native cloud execution."
    - "Keep generic organizational-role semantics owned by the exact pinned agent-skills authority instead of copying them into architect-profile. The operator-facing profile may state the durable consequence: Architect is always ChatGPT; delegated ChatGPT/Codex sessions are Executors; coder, verifier, red-team, researcher, review-advisory, ecosystem-evolution, and similar labels are Executor specializations, not additional organizational roles; final canonical acceptance remains Architect judgment."
    - "Preserve Architect self-mutation as the existing pinned generic micro-maintenance exception rather than creating a new role, lane, or self-review lifecycle. Record only the operator preference that implementation likely to materially pollute vision/authority context should be dispatched to an Executor; do not broaden generic micro-maintenance authority in this repository."
    - "Clarify repository binding behavior without adding a repo registry: repository-specific work requires an explicit current target identity from the operator/current canonical binding, followed by fresh GitHub resolution. If no target can be resolved from the explicit current request or an exact active binding, ask the operator rather than guessing from stale chat history, remembered projects, cwd, or a local directory name."
    - "Update the existing TASK LAUNCH/prompt projections and deterministic fixtures to render the corrected execution routing from canonical inputs. Prompt remains a compact authority locator/view and must not duplicate full task or generic role/protocol semantics."
    - "Update only the existing bounded validator/tests needed to prove the corrected routes, fail-closed behavior, role-owner boundary, and fresh-context bootstrap consequences. Reuse the existing OPM-01 validator/test surface; do not create a second validator framework."
  allowed_existing_files_or_components:
    - ".agent/bootstrap/authority.lock.json"
    - ".agent/bootstrap/bootstrap.json"
    - ".agent/bootstrap/validate.py"
    - ".agent/bootstrap/test_bootstrap.py"
    - "ARCHITECT_PROFILE.md"
    - "README.md"
    - "existing repository-native validation/test surfaces"

invariants:
  - "GitHub remains the only canonical repository truth; chat/model/session context is disposable convenience only."
  - "Exactly two organizational roles remain canonical under pinned agent-skills: Architect and Executor. OPM-02 creates no Reviewer, RedTeam, Runtime, Codex, controller, or specialization role."
  - "Architect remains ChatGPT. Codex never becomes Architect; when Codex is used it is an Executor."
  - "Generic role/task/review/micro-maintenance semantics remain owned by agent-skills. architect-profile owns only operator-specific defaults, routing, bootstrap, and presentation consequences."
  - "The exact four execution surfaces remain distinct by controller/location/transport; AGENT_RUNTIME remains transport only."
  - "Operator routing is exact for OPM-02: CHATGPT_GITHUB -> GPT-5.6 Sol/HIGH; CHATGPT_LOCAL -> GPT-5.6 Sol/HIGH; CODEX_CLOUD -> LUNA/MEDIUM; CODEX_LOCAL -> LUNA/MEDIUM."
  - "A repository target is never inferred merely from current local checkout, cwd, previous chat memory, or nearby repository history."
  - "OPM-02 does not change branch lifecycle. Current physical remote topology remains {dev, main}; logical staging-disabled semantics belong to OPM-03."
  - "OPM-02 does not define managed-mirror reconciliation, .env normalization, scratch/build/cache ownership, cleanup, or local resource policy; those belong to OPM-04."
  - "OPM-01 remains accepted historical truth. This task is a forward correction and must not revise TASK-0016 task/report/review artifacts."

forbidden_changes:
  - "Do not mutate agent-skills, agent-standards, agent-documents, agent-runtime, or any target product repository."
  - "Do not mutate or promote architect-profile/main."
  - "Do not create, delete, or rename any remote branch. Do not create staging in this task."
  - "Do not introduce a third organizational role or encode Executor specializations as roles."
  - "Do not create a role engine, mode engine, planner, orchestrator, registry, daemon, database, queue, scheduler, persistent execution capsule, provider pool, or availability registry."
  - "Do not duplicate the Task Protocol, Architect skill, Executor skill, review semantics, or micro-maintenance rules into bootstrap/profile artifacts. Route to their exact pinned canonical owner instead."
  - "Do not broaden Architect micro-maintenance authority or invent a normal Architect self-execution lifecycle in this repository."
  - "Do not implement OPM-03 branch-model/staging semantics or OPM-04 local/env/resource semantics."
  - "Do not turn TASK LAUNCH into a parser, template language, renderer registry, CLI framework, or presentation subsystem."
  - "Do not expand the capability index unless a concrete OPM-02 acceptance requirement cannot be satisfied by an existing route; any new route requires explicit evidence and must have exactly one canonical owner/path."

