acceptance_criteria:
  - id: AC-1
    requirement: "The existing OPM bootstrap exposes exactly four execution surfaces with exact operator routes GPT-5.6 Sol/HIGH for both ChatGPT surfaces and LUNA/MEDIUM for both Codex surfaces; AGENT_RUNTIME is transport only and unauthorized model/effort substitutions fail closed."
    evidence_required: "Exact machine-readable routing diff plus exhaustive positive/negative normalization and rendering tests."
  - id: AC-2
    requirement: "Fresh bootstrap preserves one canonical owner for generic role semantics: pinned agent-skills. architect-profile records only operator-specific consequences and does not create another role taxonomy, task protocol, review owner, or self-execution lifecycle."
    evidence_required: "Changed-surface review plus validator/test or deterministic assertions proving canonical capability routes still point to the pinned agent-skills entrypoints and no duplicate role authority is introduced."
  - id: AC-3
    requirement: "Repository-specific work cannot silently bind from cwd, local directory naming, or stale conversation memory. Explicit target identity/current exact binding is required and fresh GitHub resolution remains mandatory; unresolved target selection fails closed to operator clarification rather than guessing."
    evidence_required: "Profile/bootstrap contract evidence and a bounded fresh-context fixture or equivalent deterministic proof that target binding comes only from canonical locator inputs, not implicit local/chat state."
  - id: AC-4
    requirement: "TASK LAUNCH and PROMPT remain deterministic projections over canonical locator/surface inputs and render the corrected LUNA/MEDIUM Codex routes without duplicating task scope or generic governance."
    evidence_required: "Representative deterministic fixtures for all four surfaces and exact prompt-input validation."
  - id: AC-5
    requirement: "OPM-02 remains a minimum routing correction: no branch-model/staging implementation, managed-mirror/env work, new subsystem, new role, new lifecycle, support-repository mutation, or unnecessary capability-taxonomy growth is introduced."
    evidence_required: "Exact base-to-implementation changed paths, simplicity review, and negative assertions for forbidden scope."
  - id: AC-6
    requirement: "Implementation and report publication close on dev with independent GitHub SHA observation after each push and final canonical remote evidence sufficient for Architect review; main remains unchanged."
    evidence_required: "Exact implementation SHA, independent remote dev observation, exact report-only child SHA, second remote observation, and final branch/topology proof."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Run the existing repository-native OPM bootstrap test suite and require all tests PASS."
      required: true
    - id: CHECK-2
      command_or_check: "Run the existing bootstrap validator with immutable remote resolution and require OPM_BOOTSTRAP = TRUE."
      required: true
    - id: CHECK-3
      command_or_check: "Run negative tests proving LUNA/XHIGH or any other unauthorized Codex model/effort route fails closed; AGENT_RUNTIME-as-mode and unknown/ambiguous surfaces must continue to fail closed."
      required: true
    - id: CHECK-4
      command_or_check: "Run a fresh-context reconstruction fixture using only exact profile/bootstrap identity, canonical target/task locator inputs, requested capability slices, and selected controller/location; no trusted conversation history or cwd inference may be required."
      required: true
    - id: CHECK-5
      command_or_check: "python3 -m py_compile .agent/bootstrap/validate.py .agent/bootstrap/test_bootstrap.py && git diff --check"
      required: true
    - id: CHECK-6
      command_or_check: "Fresh-resolve remote branches and require current physical topology exactly {dev, main} with main unchanged from the authorized planning base; verify exact changed paths are the smallest sufficient OPM-02 surface."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

