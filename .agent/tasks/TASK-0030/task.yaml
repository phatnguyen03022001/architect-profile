structure_authority:
  status: RESOLVED
  source: "repository-root hygiene plus existing bootstrap verification and TASK lifecycle layout"
  rationale: >-
    architect-profile contains Python bootstrap validator/tests and no root .gitignore. Reuse the already-proven support-repo
    Python hygiene policy exactly; no profile, calibration, bootstrap, authority-lock, routing, dependency, or release semantic
    change is needed.

objective: >-
  Add the exact proven 14-line repository-root .gitignore hygiene policy to architect-profile and use this real bounded
  change as confirmatory post-activation CHATGPT_LOCAL pilot #2. Produce a clean execution-shape and timing sample when
  possible, without weakening correctness or converting execution noise into a performance claim.

scope:
  required_changes:
    - >-
      Add repository-root .gitignore with exactly: .DS_Store; __pycache__/; *.py[cod]; .venv/; venv/; .pytest_cache/;
      .mypy_cache/; .ruff_cache/; .coverage; coverage/; .env; .env.*; !.env.example; !.env.*.example.
    - >-
      Prove no tracked path becomes ignored; prove positive synthetic cases for every ignore family and negative cases for
      .env.example, a representative .env.test.example, and canonical repository paths.
    - >-
      Verify the exact candidate with local bootstrap validation, all existing bootstrap tests, py_compile using run-owned
      temporary bytecode output/cleanup, git diff --check, exact base-to-candidate scope/content checks, and final hygiene.
      Reuse accepted remote locked-route/Case-Router/no-chat correctness evidence because this candidate changes only .gitignore;
      do not rerun those acceptance producers without a named invalidation.
    - >-
      Once exact binding and capabilities are resolved, execute each maximal contiguous mechanically derivable suffix as one
      logical EXECUTION BUNDLE and realize each bundle with exactly one Agent Runtime terminal_exec.
    - >-
      For a clean pilot, the intended material controller boundaries are: (1) implementation + candidate verification +
      candidate publication + fresh post-proof, then (2) report authorship + report publication + final post-proof. Extra
      terminal_exec calls are permitted only after a valid material return reason; any Executor-authored shell/predicate error,
      retry, diagnostic recovery, ambiguous postcondition, or transport contradiction makes the latency sample NOISY even if
      the functional task later passes.
    - >-
      Record post-binding terminal_exec count, bundle mapping, controller-return reasons, directly observed RFC3339 UTC
      started_at_utc immediately before the first post-binding capability/evidence preflight, and terminal_decision_at_utc
      immediately before the terminal Executor decision. Do not reconstruct timing from Git metadata.
    - >-
      Compare descriptively with prior observations only: TASK-0036 592s/62 terminal_exec; TASK-0013 581s/22 terminal_exec;
      TASK-0007 rev2 execution-shape success but noisy latency. Do not attribute residual latency to GPT/model, controller,
      platform, transport, network, Agent Runtime, or Git without paired evidence.
    - >-
      Publish the exact .gitignore candidate on dev, then one report-only child. Main remains unchanged.
  allowed_existing_files_or_components:
    - ".gitignore"
    - ".agent/tasks/TASK-0030/report.yaml"

