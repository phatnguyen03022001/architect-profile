      Bootstrap validator, all bootstrap tests, py_compile with run-owned temporary bytecode handling, git diff --check,
      exact scope/content checks, and repository hygiene pass on the same exact candidate; unchanged remote/bootstrap
      semantics reuse existing accepted evidence rather than ceremonial reruns.
