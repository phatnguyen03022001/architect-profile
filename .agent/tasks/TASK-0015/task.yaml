structure_authority:
  status: NOT_APPLICABLE
  source: ""
  rationale: "This is a bounded correction to the two existing canonical operator-profile owners and must not create a new profile layer, registry, runtime, or workflow subsystem."

objective: >-
  Adopt the minimum operator-specific GOV-F corrections proven by GOV-E2: GitHub is always repository SSOT; macOS Codex/Agent Runtime/Terminal/IDE are subordinate execution surfaces using the operator's normal Developer working copies; normal target execution must not default to .agent-scratch; Architect output should preserve high diagnostic depth with a small material decision surface; and operator-facing launch/prompt presentation should match the current compact convention without duplicating canonical task authority.

scope:
  required_changes:
    - "Keep GitHub as the absolute canonical repository truth across phone-only and macOS execution. Local Git/filesystem state is a working copy, never alternate authority."
    - "Record the operator macOS convention that normal repository working copies live under /Users/tienphat/Developer/<repo-name>, discovered and verified by actual Git remote identity rather than trusted from path naming alone."
    - "State that Codex, Agent Runtime, Terminal, IDE, Docker/OrbStack and similar local tools are execution/inspection surfaces that serve GitHub-canonical repository state; they do not become repository or workflow authority."
    - "Normal target execution must not route through /Users/tienphat/Developer/.agent-scratch. Historical scratch artifacts remain historical evidence and are not rewritten; an isolated temporary checkout is exceptional and must be materially justified rather than the default target workspace."
    - "Keep phone-only ChatGPT + GitHub and macOS Developer/<repo> execution as supported operating contexts, with GitHub SSOT common to both."
    - "Update operator-facing task presentation to the current compact convention: RESULT plus brief EXPLAIN; when next work exists, TASK LAUNCH as NEW/CONTINUE + CODEX/CHATGPT + LUNA/SOL + effort; standalone PROMPT; END identity. Prompt text is English by current operator preference while still instructing Executor to communicate with the operator in Vietnamese and persist repository artifacts in English."
    - "Preserve PROMPT as a locator/instruction rather than duplicated authority; do not copy the full canonical task into operator-facing handoffs."
    - "Record in calibration, only if evidence remains sufficient after inspection, the cross-target operator lesson that high diagnostic depth should produce a small material decision surface and that competent Executor-local HOW should not be revised merely because Architect would choose another implementation."
    - "Keep the correction minimal: delete or replace stale conflicting profile wording rather than layering duplicate rules."

invariants:
  - "Generic role/lifecycle/task/review/reconciliation semantics remain owned by pinned agent-skills and are not duplicated into architect-profile."
  - "agent-runtime remains optional local execution capability, not SSOT, registry, planner, scheduler, sync engine, or workflow authority."
  - "The operator-specific Developer path convention does not leak into agent-skills, agent-runtime, standards, documents, or target repositories."
  - "Historical task/report evidence is not rewritten to remove past .agent-scratch references."
  - "Profile remains compact and successor-oriented rather than becoming a god context."
  - "Calibration admits only operator-specific, cross-target, experience-derived judgment with an explicit reversal boundary."

forbidden_changes:
  - "Do not modify agent-skills, agent-runtime, agent-standards, agent-documents, target repositories, workflows, releases, branches, or repository metadata."
  - "Do not introduce a repo registry, workspace registry, sync daemon, state database, path manifest, orchestration layer, new profile file, or new lifecycle."
  - "Do not make Codex or Agent Runtime mandatory when phone/GitHub capability is sufficient."
  - "Do not state that local state can override GitHub canonical truth."
  - "Do not rewrite historical .agent task/report/review artifacts merely to update old workspace wording."

