acceptance_criteria:
  - id: AC-1
    requirement: "ARCHITECT_PROFILE.md expresses one coherent GitHub-first operating model for phone and macOS execution without duplicating generic agent-skills semantics."
    evidence_required: "Focused diff showing GitHub SSOT, subordinate local surfaces, Developer working-copy convention, actual remote-identity verification, and no competing local authority."
  - id: AC-2
    requirement: "Normal macOS target execution no longer defaults to .agent-scratch and historical evidence remains untouched."
    evidence_required: "Active profile wording excludes .agent-scratch from normal target execution while exact historical task/report artifacts outside the candidate remain unchanged."
  - id: AC-3
    requirement: "Operator-facing launch/prompt UX matches the current compact convention and language boundary."
    evidence_required: "Profile diff shows RESULT/EXPLAIN, compact TASK LAUNCH, standalone English PROMPT locator, END identity, Vietnamese operator communication, English repository artifacts, and no full task duplication."
  - id: AC-4
    requirement: "Calibration captures the proven minimum-decision-surface lesson without becoming generic governance or task history."
    evidence_required: "At most one compact calibration case grounded in both GOV-E2 pilots, with transferable lesson and explicit reversal/material-consequence boundary."
  - id: AC-5
    requirement: "The correction remains minimal and owner-correct."
    evidence_required: "Candidate changes only ARCHITECT_PROFILE.md and, if AC-4 requires it, ARCHITECT_CALIBRATION.md; no new files/subsystems/external repository mutations; existing repository verification passes."
  - id: AC-6
    requirement: "When this task uses the designated macOS canonical working copy, final successful closure follows accepted TASK-0024 GitHub-first reconciliation semantics."
    evidence_required: "Executor report proves exact owner/repo binding, preservation of operator-owned local state, final GitHub main refresh, and safe local reconciliation to the final canonical report ref before NEEDS_REVIEW."

