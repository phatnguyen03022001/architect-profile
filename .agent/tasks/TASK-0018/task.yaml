  - "Locked SHA/path resolution is exact and fail-closed with no mutable-ref fallback."
  - "BOOTSTRAP is pre-router; BOOTSTRAP is not a CASE."
  - "Case Router is navigation only and grants no task, mutation, review, release, promotion, or lifecycle authority."
  - "Case Router contains capability keys only; exact owner/path resolution remains in the existing capability routing layer."
  - "The only admitted reusable CASE remains EXECUTE -> executor."
  - "Embedding remains NOT_ADMITTED and is not implemented."
  - "Exact operator routing is CHATGPT_GITHUB -> GPT-5.6 Sol/HIGH; CHATGPT_LOCAL -> GPT-5.6 Sol/HIGH; CODEX_CLOUD -> LUNA/XHIGH; CODEX_LOCAL -> LUNA/XHIGH."
  - "Physical branch topology remains exactly {dev, main}; no staging or third branch."

