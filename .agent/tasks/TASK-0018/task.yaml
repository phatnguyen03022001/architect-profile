    - "Make the Case Router a bootstrap-known canonical locator resolved only after the profile revision and authority lock are known and before ordinary capability selection. The locator must resolve .agent/case-router.yaml from the exact locked agent-skills revision."
    - "Bootstrap must not use the Case Router to discover the Case Router. BOOTSTRAP remains a pre-router primitive."
    - "Case Router resolution must fail closed when the locked agent-skills SHA is unresolvable, the router path is missing, the router artifact is malformed, or a declared case/capability cannot be validated. No fallback to main/dev/latest/nearby revisions."
    - "Preserve the accepted router semantics exactly: the only admitted reusable CASE is EXECUTE and it routes only to capability key executor. Do not copy owner/path/SHA data into the Case Router or create a second capability registry."
    - "Preserve separation CASE != BINDING != SPECIALIZATION != MODE != TASK != STATE. Unknown or ambiguous case selection must never be silently guessed or fuzzy-routed by bootstrap."
    - "Correct operator execution routing so CHATGPT_GITHUB and CHATGPT_LOCAL remain GPT-5.6 Sol/HIGH, while CODEX_CLOUD and CODEX_LOCAL are exactly LUNA/XHIGH. AGENT_RUNTIME remains transport only for CHATGPT_LOCAL."
    - "Update the existing bootstrap validator/tests minimally to prove exact lock resolution, router-path resolution at the locked SHA, pre-router bootstrap ordering, accepted EXECUTE navigation, fail-closed negative cases, and exact four-surface model/effort routing. Reuse existing validation/test surfaces."
    - "Run a fresh-context reconstruction fixture proving that with target identity and exact GitHub state but no trusted chat history, bootstrap resolves profile revision -> authority lock -> exact Case Router -> EXECUTE -> executor capability -> exact canonical executor artifact."
    - "Publish the exact implementation candidate and report on architect-profile/dev only. main must remain exactly 71921cde6228c21b4d2e3e6509e685d82981dc9c throughout this task."

  allowed_existing_files_or_components:
