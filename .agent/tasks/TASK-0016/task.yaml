structure_authority:
  status: RESOLVED
  source: "OPM-01 approved design"
  rationale: "Create only the smallest bootstrap/activation artifacts needed to make operating authority mechanically resolvable; do not add registries, daemons, services, or a new lifecycle artifact."

objective: "Materialize OPM-01: make architect-profile/dev the explicit evolution branch and create the minimum bootstrap foundation whose accepted main commit can act as authority-set activation identity P1."

scope:
  required_changes:
    - "Remove the exact accidental remote branch __probe_should_not_create__ created during Architect API verification, then require remote branch topology exactly {dev, main}; do not delete or create any other remote branch."
    - "Use dev as the integration/evolution branch while main remains the accepted stable branch. If the designated canonical local working copy lacks a local dev branch, creating only a local tracking dev branch from exact origin/dev is permitted after proving repository identity, clean tracked/index state, and exact remote dev identity."
    - "Add a compact bootstrap entrypoint that resolves the current architect-profile commit, then the exact authority lock, then capability routing, target repository binding, topology, and execution mode without requiring chat memory or whole-repository preload."
    - "Add an authority lock that pins exact immutable accepted revisions for agent-skills, agent-standards, agent-documents, and agent-runtime. The lock must not self-pin architect-profile."
    - "Add a static capability routing index with exactly one canonical owner/path entrypoint per capability and no mutable registry/state/cache semantics."
    - "Add the four operator execution surfaces CHATGPT_GITHUB, CODEX_CLOUD, CODEX_LOCAL, and AGENT_RUNTIME, normalized to REMOTE or LOCAL execution classes with GitHub authority and publication/local-workspace policy metadata sufficient for deterministic routing."
    - "Add one canonical operator-facing TASK LAUNCH rendering grammar so prompts are views over canonical task/handoff/repository/authority data rather than independently maintained authority text."
    - "Add an explicit repository contract for architect-profile declaring DEV_MAIN, working ref dev, stable ref main, and MANAGED_MIRROR local policy."
    - "Provide deterministic validation proving every authority-lock SHA resolves, every routed capability path exists at its exact locked revision, each capability has exactly one canonical entrypoint, execution modes normalize without ambiguity, and the repository contract is explicit rather than inferred from checkout state."
  allowed_existing_files_or_components:
    - "ARCHITECT_PROFILE.md"
    - "ARCHITECT_CALIBRATION.md"
    - ".agent/"
    - "existing repository-native validation/test surfaces"
    - "new small bootstrap/lock/routing/mode/presentation files at the smallest repo-native locations chosen by Executor"

invariants:
  - "GitHub is canonical repository truth; chat context is non-authoritative convenience only."
  - "architect-profile/main remains stable during implementation; all OPM-01 implementation and report publication occur on dev."
  - "After the one exact cleanup, remote branch topology is exactly {dev, main}."
  - "The exact architect-profile commit containing a validated lock is the authority-set identity; architect-profile must not self-pin inside the lock."
  - "A locked SHA or routed path that cannot be resolved fails closed; there is no fallback to main, dev, a nearby commit, or a closest available version."
  - "One capability has one canonical owner/path routing entrypoint. Cross-references may exist, but the routing index must never require the model to merge multiple semantic owners to resolve one capability."
  - "Execution modes are routing/presentation context, not task authority and not a new organizational role, lifecycle, service, registry, daemon, or persistent execution engine."
  - "Repository topology is explicit machine-readable target authority after bootstrap; it must never be inferred from the currently checked-out branch."
  - "DEV_MAIN is the operator bootstrap default for newly bootstrapped repositories, but an existing repository contract may explicitly declare another supported topology such as MAIN_ONLY."
  - "MANAGED_MIRROR means GitHub wins for canonical tracked repository state at idle/success boundaries; OPM-01 defines the policy but does not implement a sync daemon or destructive workspace sweep."
  - "agent-runtime remains execution transport only; this task must not add project registry, synchronization state, workflow authority, planner, queue, daemon, or Git semantic ownership to agent-runtime."
  - "agent-documents remains target product/design documentation authority; this task must not move task/handoff/report/review workflow templates into agent-documents."
  - "agent-standards remains engineering/evidence semantics authority; this task must not move Git workflow-state meanings such as publication or synchronization into agent-standards."
  - "Normal rollback of a future authority set must be representable by a new forward architect-profile activation commit; OPM-01 must not require force-moving main backward."

forbidden_changes:
  - "Do not mutate agent-skills, agent-standards, agent-documents, agent-runtime, or any target repository in this task."
  - "Do not promote or mutate architect-profile/main in this execution."
  - "Do not create staging."
  - "Do not create any remote branch. The only branch creation permitted is a local tracking dev branch in the designated canonical local working copy when required to bind exact origin/dev."
  - "Do not delete any remote branch except exact __probe_should_not_create__."
  - "Do not create program.lock, a persistent Execution Capsule, project registry, sync daemon, mode service/engine, database, queue, scheduler, or shared mutable cross-repository authority."
  - "Do not add a third organizational role."
  - "Do not duplicate full support-repository semantics into BOOTSTRAP; bootstrap must remain a compact locator/resolver entrypoint."
  - "Do not encode provider secrets, account identities, local secret values, or machine-specific secret material."
  - "Do not broaden this task into assurance-profile or PROGRAM synthesis work."

