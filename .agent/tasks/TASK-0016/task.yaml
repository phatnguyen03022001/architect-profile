acceptance_criteria:
  - id: AC-1
    requirement: "architect-profile has exact remote topology {dev, main} and explicit DEV_MAIN repository authority with dev as working ref, main as stable ref, and MANAGED_MIRROR local policy; no runtime inference from current checkout is required."
    evidence_required: "Fresh remote branch proof, machine-readable repository contract, validator/test evidence, and exact Git diff."
  - id: AC-2
    requirement: "A compact bootstrap entrypoint can start from the exact architect-profile revision and mechanically locate the authority lock, capability routing, repository/topology resolution, and execution-mode resolution without whole-ecosystem preload or trusted chat state."
    evidence_required: "Bootstrap artifact, bounded reconstruction test, and proof that chat history is not required input."
  - id: AC-3
    requirement: "The P1 authority lock pins exact immutable accepted revisions: agent-skills 337c0be6618090e704b345b1bf93df488a4985af; agent-standards 3f4950f280a3a35fee81471d4b83715fa72cf9ee; agent-documents 6918f46282f4a92bbc61071444a5ff5dab30ddc9; agent-runtime 9d5320d5afbc9aff20834801bfd6695b27cf2a0e, with no architect-profile self-pin and no fallback semantics."
    evidence_required: "Exact lock contents plus successful immutable-resolution tests and negative tests for missing/unresolvable revisions."
  - id: AC-4
    requirement: "Capability routing is static and deterministic: every declared capability resolves to exactly one canonical owner/path, every path exists at its exact locked revision, and duplicate or missing entrypoints fail validation."
    evidence_required: "Routing index and positive/negative validator tests."
  - id: AC-5
    requirement: "The four execution surfaces CHATGPT_GITHUB, CODEX_CLOUD, CODEX_LOCAL, and AGENT_RUNTIME resolve unambiguously to REMOTE or LOCAL classes and carry sufficient routing metadata to distinguish native-machine access, managed-mirror use, and publication expectations without granting task authority."
    evidence_required: "Machine-readable execution-mode contract and exhaustive normalization tests."
  - id: AC-6
    requirement: "There is one canonical TASK LAUNCH rendering grammar driven from canonical inputs; operator-facing prompt text is presentation/view data and does not duplicate task authority."
    evidence_required: "Rendering grammar/template plus representative deterministic render fixtures for all four execution surfaces."
  - id: AC-7
    requirement: "The bootstrap foundation does not create a God Context or God System: no registry, daemon, mode engine, persistent capsule, shared mutable cross-repository state, duplicated authority owner, or whole-repository preload requirement is introduced."
    evidence_required: "Exact changed-surface review, simplicity/adversarial assertions, and validator evidence."
  - id: AC-8
    requirement: "The implementation is remotely published on dev, the published implementation SHA is independently observed on GitHub, the canonical Executor report is then committed and pushed, the report SHA is independently observed on GitHub, and the designated local architect-profile working copy is reconciled to the final remote dev SHA before NEEDS_REVIEW."
    evidence_required: "Exact implementation SHA, independent remote-ref observation, exact report SHA, second remote-ref observation, and final local==remote proof."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Run the repository-native validator/test suite covering bootstrap, lock resolution, routing uniqueness/path existence, execution-mode normalization, repository contract, and rendering fixtures."
      required: true
    - id: CHECK-2
      command_or_check: "Run negative tests proving unresolvable locked SHA, missing routed path, duplicate capability entrypoint, and ambiguous/unknown execution mode fail closed."
      required: true
    - id: CHECK-3
      command_or_check: "Run a fresh-context reconstruction fixture that starts with only the target/bootstrap locator and exact Git state and resolves the locked capability entrypoints without conversational memory."
      required: true
    - id: CHECK-4
      command_or_check: "git diff --check"
      required: true
    - id: CHECK-5
      command_or_check: "Verify exact final changed paths are the smallest sufficient OPM-01 surface and contain no unrelated profile/governance expansion."
      required: true
    - id: CHECK-6
      command_or_check: "Fresh-resolve remote branches and require exact topology {dev, main}; prove __probe_should_not_create__ is absent."
      required: true
  authoritative_verification:
    required: false
    mechanism: ""
    expected_signal: ""

