      required: true
    - id: CHECK-3
      command_or_check: "Inspect the learning-signal trigger and prove no mandatory retrospective occurs when no material signal exists."
      required: true
    - id: CHECK-4
      command_or_check: "Confirm NONE/REVISE/ADD/DELETE/MOVE remain non-persisted reasoning shorthand and create no authority, schema, artifact, lifecycle, or automatic mutation semantics."
      required: true
    - id: CHECK-5
      command_or_check: "Confirm narrowest-owner routing matches existing profile/calibration ownership and requires separate explicit binding/authority before mutation of another repository."
      required: true
    - id: CHECK-6
      command_or_check: "Confirm no historical scan/backfill, learning framework, registry, queue, database, dashboard, cron, benchmark harness, or unrelated semantic change was introduced."
      required: true
    - id: CHECK-7
