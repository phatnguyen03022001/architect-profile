    - exact_remote_ref_read
    - repository_content_read
    - repository_content_write
  REVIEW:
    - exact_commit_report_resolution
    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "Fresh Architects receive an explicit evidence-triggered post-cycle learning checkpoint without mandatory ceremony."
    evidence_required: "ARCHITECT_PROFILE.md defines concrete material learning signals and explicitly avoids broad retrospectives when no signal exists."
  - id: AC-2
    requirement: "Learning dispositions are minimal and non-protocol."
    evidence_required: "Profile uses NONE/REVISE/ADD/DELETE/MOVE only as local reasoning shorthand and explicitly denies schema/lifecycle/artifact/authority meaning."
  - id: AC-3
    requirement: "Durable learning routes to the narrowest canonical owner and preserves existing calibration admission rules."
    evidence_required: "Profile maps operator-specific calibration, generic governance, standards, documents, runtime, and target truth to their existing owners without duplicating doctrine."
  - id: AC-4
    requirement: "Checkpoint cannot cause hidden cross-repository mutation or automatic promotion."
    evidence_required: "Profile requires explicit later binding/authority for a different owner and keeps observations non-authoritative and non-automatic."
  - id: AC-5
    requirement: "The mechanism is optimized for token/cost discipline."
    evidence_required: "Profile requires only evidence-local inspection, no all-history/all-repository scan, no persisted NONE log, no automatic retrospective, and no framework infrastructure."
  - id: AC-6
    requirement: "Implementation and publication remain bounded."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md; report is a report-only direct child; topology remains {main}."

