invariants:
  - "Architect remains ChatGPT and GitHub remains canonical repository truth."
  - "Capability availability never creates repository/task/mutation/release authority."
  - "Current-session evidence outranks remembered capability availability."
  - "Target-specific IELTS product truth, task state and implementation details remain in the IELTS repository and are not copied into profile/calibration."
  - "Calibration contains only operator-specific cross-target reusable experience-derived judgment with explicit reversal boundaries."
  - "No platform hard limit is invented when the backend does not expose it."
  - "No capability registry, environment inventory, benchmark harness, CI dashboard, prompt mega-template, agent database, control plane, or new governance repository is introduced."
  - "Repository topology remains exactly {main}."

forbidden_changes:
  - "Do not modify agent-skills, agent-standards, agent-documents, agent-runtime, IELTS, or any other target repository."
  - "Do not create a generic capability state schema, registry, machine-readable inventory, session database, probe suite, stress-test harness, automation, or telemetry collector."
  - "Do not hard-code temporary-session properties such as current CPU count, RAM, disk, package list, kernel, exact context usage, hidden reasoning budget, hard tool-call cap, or current connected-app set."
  - "Do not claim consumer ChatGPT/Codex/GitHub product behavior that cannot be confirmed from current evidence."
  - "Do not add raw IELTS executor transcripts, task chronology, screenshots, private account/billing data, or target-specific facts to calibration."
  - "Do not turn NEEDS_REVIEW into permission for broad redesign or unconditional full-repository audit."
  - "Do not make Actions mandatory when a cheaper sufficient proof surface exists."
  - "Do not add a third persistent role or make Codex/GitHub Actions governance owners."
  - "Do not perform unrelated profile cleanup."

