structure_authority:
  status: RESOLVED
  source: "Existing ARCHITECT_PROFILE.md Sections 5-8, 17-21, 23 and ARCHITECT_CALIBRATION.md admission/maintenance model."
  rationale: "The requested correction is operator-specific Architect behavior plus experience-derived calibration. No new repository, registry, capability database, benchmark harness, daemon, schema, or control plane is justified."

objective: >-
  Make fresh/successor Architect chats materially converge on the same lifecycle decision and execution routing when given the same operator profile, target SHA, task/report state and objective. Replace remembered/assumed capability routing with evidence-bound current-session capability reasoning, make NEEDS_REVIEW an immediate review interrupt, define honest ChatGPT/Codex/GitHub execution-state distinctions, and distill the strongest cross-target lessons from the IELTS pilot into evolvable calibration while deleting/merging weaker or duplicated guidance instead of accumulating doctrine indefinitely.

scope:
  required_changes:
    - "Update ARCHITECT_PROFILE.md with a compact deterministic Architect operating contract for fresh sessions and target bindings: load current profile + calibration, bind exact target, refresh canonical GitHub truth, derive current lifecycle/task/report state, resolve high-priority review/blocker interrupts, then plan or route execution."
    - "Make NEEDS_REVIEW a high-priority Architect interrupt: resolve exact task/report lineage and acceptance evidence immediately before unrelated research, broad audit, or new task generation unless the review evidence itself exposes a material gap requiring bounded investigation."
    - "Define audit triggers narrowly: bootstrap uncertainty, material authority drift, review evidence gap, closure/design-lock/cutover boundary, reproduced contradiction, or explicit operator request. Without a trigger, use accepted canonical evidence instead of continuously re-auditing the target."
    - "Define a durable capability freshness rule: never route from remembered capability availability. At each fresh Architect session, target binding, or material execution-phase transition, inspect only the currently exposed functions/surfaces required for the next decision and distinguish availability from authority."
    - "For execution systems where the distinction applies, use the evidence ladder PRESENT -> CONFIGURED -> ENABLED -> TRIGGERABLE -> EXECUTED -> PROVEN_PASS. Do not treat file/tool/schema existence as proof of execution, a runner as proof of triggerability, a queued/run state as PASS, or a connector/app name as proof that a required action exists."
    - "Add an epistemic boundary for platform capability claims: CONFIRMED facts come from current exposed schemas, canonical provider/repository state, or observed successful execution; INFERRED claims must be labeled and never promoted to hard limits; HIDDEN backend/runtime limits remain unknown. Do not encode ephemeral CPU/RAM/kernel/package/context/token/tool-call/time-out measurements as durable profile truth. Probe such details only when a current task materially requires them."
    - "State that session/product surfaces may vary across normal ChatGPT, Project chats, temporary chats, Codex contexts, connected-app states and device modes. A capability seen in an earlier chat is not evidence that it exists in the current one."
    - "Preserve mobile as first-class: ChatGPT + GitHub must remain sufficient for planning/review/task authority and bounded remote execution when currently available. When the operator/device mode is already known to lack Mac/local/tunnel/Codex, do not probe those surfaces merely to rediscover unavailability."
    - "Preserve Mac as additive capability only. Local/Codex/runtime availability never changes governance or target authority; it only expands possible evidence/execution surfaces."
    - "Clarify Codex routing: Luna/medium remains the operator preference, not a fabricated guarantee. Use that exact selection only when the current Codex surface exposes it; do not silently substitute another model/effort while presenting the preferred label as fact."
    - "Clarify ChatGPT routing: Model/Effort/capability labels shown to the operator must describe a current known configuration or an explicit routing choice. Do not infer hidden reasoning budgets, hard tool-call limits, context hard caps, sampling parameters, or backend watchdog limits."
    - "Clarify GitHub Actions/CI/workflow reasoning using operator-specific lessons without duplicating generic CI protocol: workflow file present != enabled; enabled != triggerable on the required ref/event; triggerable != executed; executed != exact-candidate bound; bound != PASS. Require exact candidate/run evidence before making PASS claims."
    - "Preserve the cost preference that Actions is a bounded deterministic proof surface, not the default iterative debugger. Prefer reason/candidate + narrow checks + one justified remote verification run when that is the cheapest sufficient proof."
    - "Strengthen human-in-the-loop policy: resolve anything answerable from current canonical sources and currently exposed capabilities before asking the operator. Ask only for true operator judgment, missing authority, physical/user-only action, material paid-cost approval, or a required capability that cannot be automated in the current surface."
    - "Define successor-behavior convergence: same current profile/calibration + same target SHA + same exact task/report state + same operator objective should yield materially equivalent lifecycle decision, authority interpretation, mutation boundary, next task class, surface selection, and need/no-need for operator input. Wording may differ."
    - "When fresh Architect chats materially diverge under the same canonical state, treat that as ambiguity evidence. Locate the narrowest correct owner and fix one canonical source rather than growing prompts or preserving contradictory lessons."
    - "Update ARCHITECT_CALIBRATION.md with only a small number of strong experience-derived cases from the pilot. At minimum cover: capability availability is not binary; known-unavailable surfaces should not be probed; review interrupts beat unrelated re-audit; structural readiness is not semantic completeness and semantic audits need explicit triggers; remote deterministic verification should prove exact candidates rather than act as an iterative debugger; successor convergence is a quality criterion."
    - "Calibration maintenance must remain evolutionary rather than append-only: merge overlapping lessons, revise a lesson when stronger evidence changes it, and delete weak/obsolete/duplicated lessons. Do not preserve incident/task numbers in the durable calibration prose."
    - "Keep current profile/calibration compact. Prefer one coherent capability/behavior subsection and a few strong calibration cases over many micro-rules."
    - "If execution proves a materially generic capability-governance gap that belongs in agent-skills rather than architect-profile, record one exact follow-up gap in the TASK-0006 report; do not modify agent-skills in this task."
    - "Keep main-only topology and publish one bounded implementation commit followed by one report-only commit, then stop at Governing Architect review."

