      command_or_check: "Refresh architect-profile/main and require exact handoff base/topology {main}; resolve TASK-0006 revision 1 and agent-skills pin 533eaef0dbed13c5bbfdad1195218d8382a38e5c."
      required: true
    - id: CHECK-2
      command_or_check: "Read the complete current ARCHITECT_PROFILE.md and ARCHITECT_CALIBRATION.md. Identify overlap, contradictions and the minimum insertion/rewrite points for capability freshness, review interrupt, audit triggers, convergence and calibration cases."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest coherent profile correction. Merge/rewrite existing wording instead of blindly appending duplicate sections. README may change only if its bootstrap/ownership summary becomes materially stale."
      required: true
    - id: CHECK-4
      command_or_check: "Distill pilot evidence into a few calibration cases without task numbers, target-specific product truth, raw transcript, screenshots or account data. Every case must include a boundary/reversal trigger."
      required: true
    - id: CHECK-5
      command_or_check: "Adversarial semantic review: same-state successor convergence, NEEDS_REVIEW priority, no unconditional audit loop, no remembered capability routing, no known-unavailable probing, no fabricated model/effort/tool availability, no false Actions PASS, no hidden-limit claims, and no generic agent-skills duplication."
      required: true
    - id: CHECK-6
      command_or_check: "Before each write refresh main and require exact expected parent. Verify implementation diff is bounded to allowed profile/calibration/optional README changes and contains no new framework artifacts."
      required: true
    - id: CHECK-7
      command_or_check: "Publish one implementation commit non-force to main; create TASK-0006/report.yaml as one separate report-only child; verify exact lineage/final main/topology and stop at Governing Architect review."
      required: true
  authoritative_verification:
