acceptance_criteria:
  - id: AC-1
    requirement: "Fresh/successor Architect behavior is materially deterministic from canonical state rather than hidden chat history."
    evidence_required: "Profile defines an explicit bootstrap/target-binding/lifecycle-resolution order plus same-state material-convergence criterion."
  - id: AC-2
    requirement: "Capability routing is evidence-bound and current-session aware."
    evidence_required: "Profile forbids routing from remembered availability, distinguishes current capability evidence from authority, includes the PRESENT->...->PROVEN_PASS ladder where applicable, and labels hidden backend limits unknown."
  - id: AC-3
    requirement: "ChatGPT, Codex and GitHub execution behavior is represented without guessing."
    evidence_required: "Profile preserves operator preferences while requiring current exposed model/effort/tool/action evidence; GitHub workflow/Actions states cannot be conflated; no ephemeral runtime numbers are canonized."
  - id: AC-4
    requirement: "Review and audit behavior converges."
    evidence_required: "NEEDS_REVIEW is an immediate bounded review interrupt; audit triggers are explicit; accepted canonical evidence is reused when no trigger exists."
  - id: AC-5
    requirement: "Human intervention and cost stay low without weakening evidence."
    evidence_required: "Profile resolves canonical/tool-answerable questions before asking operator and treats Actions as bounded proof rather than iterative debugger by default."
  - id: AC-6
    requirement: "Experience transfers and evolves instead of accumulating noise."
    evidence_required: "Calibration contains a compact set of evidence-derived cross-target cases with boundaries and explicitly supports merge/revise/delete; no task chronology or target truth is copied."
  - id: AC-7
    requirement: "Ownership remains clean."
    evidence_required: "Generic protocol remains referenced to agent-skills; any discovered generic gap is report-only follow-up evidence; no cross-repo mutation or new framework occurs."
  - id: AC-8
    requirement: "Change is bounded and reviewable."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md, ARCHITECT_CALIBRATION.md and README.md if strictly needed; report is separate; topology remains {main}."

verification:
  executor_checks:
