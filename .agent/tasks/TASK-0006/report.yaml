implementation_summary:
  - "Added one coherent operator-specific capability-freshness contract: current-session evidence outranks remembered availability, capability remains separate from authority, and platform claims are classified as CONFIRMED, INFERRED, or HIDDEN."
  - "Defined the PRESENT -> CONFIGURED -> ENABLED -> TRIGGERABLE -> EXECUTED -> PROVEN_PASS evidence ladder without turning it into a registry or generic protocol replacement."
  - "Made NEEDS_REVIEW an immediate bounded Architect interrupt, constrained broad semantic audits to explicit triggers, and required accepted canonical evidence to be reused when no trigger exists."
  - "Clarified mobile as first-class, Mac/local/Codex as additive only, Luna/medium as a conditional operator preference, and ChatGPT/Codex capability labels as current-evidence claims rather than fabricated guarantees."
  - "Made GitHub Actions a bounded exact-candidate proof surface rather than the default iterative debugger and strengthened the low-human-in-loop rule to resolve canonical/tool-answerable questions before asking the operator."
  - "Defined material successor convergence from the same canonical inputs and treats same-state divergence as ambiguity evidence to repair in the narrowest existing owner instead of growing prompts or governance machinery."
  - "Distilled five strong cross-target calibration cases with explicit reversal boundaries while retaining the existing forecast lesson and evolutionary merge/revise/delete maintenance model."

