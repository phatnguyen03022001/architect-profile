    - "Do not rewrite .agent/tasks/** historical references to agent-runtime. Historical task/report/review evidence remains truthful history and is not current operational guidance."
    - "Do not mutate agent-runtime, agent-documents, agent-skills, agent-standards, local machine state, tunnel profiles, repository metadata, or any other repository."
    - "Verify the final current README.md and ARCHITECT_PROFILE.md contain no remaining operational statement that agent-runtime is a live execution capability. Any remaining literal agent-runtime token outside .agent/tasks must be explicitly classified as intentional non-operational history; otherwise remove/rewrite it within the two authorized files."
