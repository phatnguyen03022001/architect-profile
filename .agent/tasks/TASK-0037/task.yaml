structure_authority:
  status: RESOLVED
  source: "Current operator mechanical-freeze requirement plus current GitHub repository-ruleset semantics."
  rationale: "The smallest sufficient mechanism for this repository is one active repository-level branch ruleset targeting exactly refs/heads/dev and refs/heads/main, with no bypass actors and exactly two rules: deletion and non_fast_forward. This preserves ordinary fast-forward evolution while blocking branch deletion and force-push without adding PR, reviewer, status-check, signing, queue, deployment or release machinery. If the current GitHub account/API cannot truthfully enforce this exact configuration, fail closed instead of weakening or simulating it."

objective: "Mechanically protect architect-profile dev/main ref integrity against deletion and non-fast-forward rewrite, with no ordinary-operation bypass and no source, authority, main-ref, tag or release mutation."

scope:
  required_changes:
    - "Before metadata mutation, fresh-bind this exact task/base and re-run the current consequence-boundary preflight: exact five selected dev identities, TASK-0036 ACCEPTED, current authority.lock equality, exact locked Case Router, all nine capability routes, architect-profile main ancestor of dev, topology exactly dev/main, no open issue/PR affecting activation, and current metadata/ruleset state."
    - "Before metadata mutation, run on the exact task base: python3 -B .agent/bootstrap/validate.py ; python3 -B .agent/bootstrap/validate.py --remote ; python3 -B -m unittest discover -s .agent/bootstrap -p 'test_*.py' ; python3 -B -m py_compile .agent/bootstrap/validate.py .agent/bootstrap/test_bootstrap.py. All must PASS."
    - "Fresh-preflight current GitHub repository-administration capability sufficient to create and read repository rulesets. If unavailable, stop before metadata mutation with CURRENT_PHASE_CAPABILITY_UNAVAILABLE or MECHANICAL_FREEZE_BLOCKED as applicable."
    - "Create exactly one active repository-level branch ruleset for phatnguyen03022001/architect-profile targeting exactly refs/heads/dev and refs/heads/main, with an empty bypass list and exactly the deletion and non_fast_forward rules. Do not add any other rule or target."
    - "After metadata mutation, fresh-read GitHub canonical metadata and prove the effective ruleset is active, targets exactly dev/main, has no bypass actors, blocks deletion and non-fast-forward updates, and adds no unrelated rule. The post-ruleset report publication fast-forward to dev must remain permitted."
    - "Publish only .agent/tasks/TASK-0037/report.yaml as the repository-content mutation after the planning commit. Validate the actual report, run git diff --check, push the report-only direct child non-force to dev, fresh-prove dev/main/topology plus effective ruleset, then stop at NEEDS_REVIEW."
  allowed_existing_files_or_components: []
  expected_files_are_restrictive: true

invariants:
  - "No source, bootstrap, profile, authority.lock, PROGRAM, prior task, workflow, dependency or generated content changes."
  - "No mutation to agent-skills, agent-documents, agent-standards, agent-runtime or ilets in this repository binding. Their selected authority SHAs remain unchanged."
  - "architect-profile main remains exactly d47114404c97fcfd74b0f37f646586ec46de6987 throughout TASK-0037; this task does not perform stable activation."
  - "Topology remains exactly dev/main. No branch creation, deletion or rename."
  - "The ruleset grants no bypass actor. Repository administrators are not placed on a bypass list."
  - "The ruleset contains only deletion and non_fast_forward. Normal fast-forward writes to dev remain possible."
  - "No required pull requests, mandatory reviewers, CODEOWNERS, merge queue, status checks, deployments, signed commits, release workflow, dependency automation, registry, scheduler, queue, controller or new governance mechanism."
  - "System-level MECHANICAL_FREEZE is not PASS merely because architect-profile is protected; the four support repositories require their own repository-local mechanical ref-integrity closure before stable activation."

forbidden_changes:
  - "Do not mutate architect-profile/main, promote, merge, rebase, force-push or rewrite history."
  - "Do not create/delete/rename branches or tags, publish/mutate releases, or mutate repository settings unrelated to this one ruleset."
  - "Do not modify support repository source, refs or metadata from this task binding."
  - "Do not add overlapping branch protection in addition to the single ruleset when the ruleset succeeds."
  - "Do not use a freeze tag alternative unless GitHub rejects the exact required ruleset capability and the Governing Architect has separately authorized that alternative after reviewing the truthful blocker."

