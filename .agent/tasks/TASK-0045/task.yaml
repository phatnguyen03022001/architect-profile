structure_authority:
  status: RESOLVED
  source: "ARCHITECT_PROFILE.md operator configuration plus one bounded local sentinel replacement"
  rationale: "The durable rules are operator-specific, not generic engineering governance. Keep them in architect-profile; do not move them into agent-runtime source, agent-skills, standards, a controller, or a monitoring framework."

objective: "Persist the minimum operator-specific repository-container identity and Agent Runtime lifecycle boundary, then replace only a freshly proven agent-runtime-sentinel with one equivalent health-only container named agent-runtime while preserving the currently running native macOS Runtime/tunnel/session and port 8080 without any Runtime recovery or lifecycle action."

scope:
  required_changes:
    - "Fresh-bind TASK-0045 revision 2 at its exact handoff base. Before any infrastructure mutation, fresh-resolve architect-profile dev/main, exact selected authority, current Agent Runtime transport availability, Docker context, OrbStack engine identity, all current containers, the exact candidate sentinel configuration/ownership, exact local BusyBox digest/architecture, and the native macOS listener/process on 127.0.0.1:8080. All preflight against Runtime, tunnel, listener, containers, images, and host processes is read-only."
    - "Mutation preconditions are exact: Docker context is orbstack; engine OperatingSystem is OrbStack on arm64; agent-runtime-sentinel exists; agent-runtime does not exist; agent-runtime-sentinel is positively mapped to phatnguyen03022001/agent-runtime and remains a health-only probe of host.docker.internal:8080; native 8080 remains external to the container; and local busybox@sha256:8d7b1636e974e0adfd8d945955fca609304f0a56c18799dfd032d6e661382d84 resolves to arm64. If any predicate is unproven, contradictory, or Runtime/local execution is unavailable, perform no container mutation and REPORT/BLOCK only. Do not recover Runtime, pull/build/substitute an image, or ask OrbStack to start native Runtime."
    - "Modify only ARCHITECT_PROFILE.md before infrastructure lifecycle mutation. Add one compact operator-owned subsection that persists: persistent repository containers are optional; when present steady state allows at most one and its name equals the GitHub repository basename exactly; name alone never proves ownership; unknown/unrelated resources fail closed; task-owned transient containers are removed before terminal state; multiple logical services do not authorize multiple persistent repo containers; conflicts are reported rather than hidden behind orchestration; native Agent Runtime, secure tunnel, port 8080 listener, and final agent-runtime sentinel are OPERATOR_ONLY lifecycle resources; agents may inspect and use Runtime while available but never lifecycle-manage/recover those resources; Runtime unavailable means report only; an application needing 8080 must choose another port; and Runtime/tunnel restart is forbidden as verification, cleanup, deployment, convenience, or health-testing because preserving active session continuity is a hard requirement."
    - "Prepare the exact repository implementation candidate containing only the ARCHITECT_PROFILE.md change before any container lifecycle mutation. No other existing repository source/configuration file may change."
    - "DELETE AUTHORITY is exactly one container: agent-runtime-sentinel. Immediately before deletion, re-inspect that exact container and re-prove positive ownership plus every safety predicate. Delete it exactly once. No wildcard, prefix, Compose, label-selector, image-based, prune, or bulk lifecycle action is authorized."
    - "CREATE AUTHORITY is exactly one container: agent-runtime. Use only busybox@sha256:8d7b1636e974e0adfd8d945955fca609304f0a56c18799dfd032d6e661382d84 with inert main process sleep 2147483647 and Docker-native healthcheck nc -z -w 2 host.docker.internal 8080, interval 10s, timeout 3s, retries 2. The container must be detached; restart policy unless-stopped; read-only rootfs; CapDrop ALL; no CapAdd; no-new-privileges=true; Privileged=false; no published ports; no mounts/binds/devices exposing docker.sock, OrbStack control sockets, host filesystem, repository source, Runtime files, or credentials; no Runtime secrets; no host-control bridge or lifecycle-control hook; NanoCpus=50000000; Memory=16777216; MemorySwap=16777216; PidsLimit=16. Its restart policy applies only to the sentinel process and must have no path that restarts, signals, repairs, or manages native Runtime."
    - "Final labels must include at minimum local.operator.agent-runtime.repository=phatnguyen03022001/agent-runtime, local.operator.agent-runtime.owner=operator, local.operator.agent-runtime.purpose=health-sentinel, local.operator.agent-runtime.lifecycle-authority=operator-only, local.operator.agent-runtime.protected=true, and local.operator.agent-runtime.protected-port=8080. Do not retain the old sentinel label namespace as the canonical final namespace."
    - "Immediately after successful creation of agent-runtime, the one-time container lifecycle exception is exhausted permanently for this task. From that point onward Runtime, tunnel, listener 8080, and final agent-runtime container are inspect/use-only for agents and OPERATOR_ONLY for lifecycle. Post-verification is read-only; repository report publication does not renew infrastructure authority."
    - "Never use kill, pkill, killall, lsof-to-kill pipelines, broad PGID/process-tree cleanup, Docker stop/restart/rm/recreate/exec-as-control, Compose lifecycle actions, or equivalents in a way that can reach Agent Runtime, tunnel-client, the 8080 owner, or final agent-runtime. If another target task conflicts with 8080, that target must bind another port; 8080 is never freed by an agent."
    - "Health semantics are observation only: HEALTHY means host.docker.internal:8080 is reachable and UNHEALTHY means unreachable. Do not stop/restart Runtime or tunnel to test the negative case; prove it from the exact healthcheck exit semantics and absence of repair hooks. If Runtime becomes unavailable, report only and preserve current state."
    - "Read-only classify all other current containers as needed for proof, but mutate none. ilets, phat-portfolio, unknown, unrelated, and OrbStack-internal resources are strictly out of scope."
    - "Run applicable repository-native profile/bootstrap checks, exact changed-path/diff checks, and git diff --check. Create only .agent/tasks/TASK-0045/report.yaml after repository checks and successful read-only post-inspection. Set final_execution_head to the exact pre-report candidate, validate report structure where supported, publish candidate then report non-force to dev, fresh-prove report-only direct-child lineage and unchanged main, and stop at NEEDS_REVIEW."

