structure_authority:
  status: RESOLVED
  source: "ARCHITECT_PROFILE.md operator-configuration ownership plus one bounded local remediation"
  rationale: "The naming/count invariant is operator-specific rather than a universal engineering rule, so the durable owner is architect-profile. The minimum repository change is one compact subsection in ARCHITECT_PROFILE.md. The current local sentinel mismatch is the single explicitly authorized remediation. No agent-runtime source change, generic skill/standard change, registry, controller, supervisor, Compose redesign, or additional task is warranted."

objective: "Persist the operator-specific OrbStack repository-container identity invariant in its narrow canonical owner and remediate only the freshly proven agent-runtime sentinel naming mismatch by replacing agent-runtime-sentinel with an equivalent sentinel-only container named exactly agent-runtime, without moving, restarting, stopping, signaling, proxying, or reconfiguring native macOS Agent Runtime, its tunnel, or port 8080."

scope:
  required_changes:
    - "Fresh-bind TASK-0045 revision 1 at its exact handoff base. Before any mutation, fresh-resolve architect-profile dev/main, exact selected authority, Agent Runtime availability, Docker context, OrbStack engine identity, all current containers, exact names, labels, images, mounts, published ports, restart policies, healthchecks, capabilities, security options, CPU/memory/PID limits, current health, positive repository ownership mappings, the native macOS listener on 127.0.0.1:8080, and relevant GitHub repository basenames. Preflight itself is read-only; do not restart, stop, signal, remove, create, or reconfigure any container/process during preflight."
    - "Require these exact mutation preconditions before lifecycle action: Docker context is orbstack; engine OperatingSystem is OrbStack on arm64; agent-runtime-sentinel exists; no container named agent-runtime exists; agent-runtime-sentinel is positively mapped to phatnguyen03022001/agent-runtime from fresh container evidence plus exact repository identity; its purpose remains a read-only health sentinel probing only host.docker.internal:8080; native port 8080 remains a macOS listener external to the container; the exact local image busybox@sha256:8d7b1636e974e0adfd8d945955fca609304f0a56c18799dfd032d6e661382d84 exists and resolves to arm64. If any precondition is not proven, perform no container mutation and return BLOCKED. Do not pull or build another image as a fallback."
    - "Modify only ARCHITECT_PROFILE.md to add one compact operator-specific repository-container identity subsection. It must state: persistent repository containers are optional; if one exists, steady state permits at most one per repository and its container name must equal the GitHub repository basename exactly; container name alone never proves ownership; unknown/unrelated/OrbStack-internal resources fail closed; task-owned transient containers must be removed before terminal state; multiple logical services do not by themselves authorize multiple persistent repo containers; a genuine conflict with the one-container convention is reported as CONSTRAINT_CONFLICT rather than hidden by new orchestration; matching names grant no lifecycle authority over operator-owned shared infrastructure. Do not duplicate generic task/process ownership semantics already owned by agent-skills."
    - "Prepare the repository implementation candidate for only the ARCHITECT_PROFILE.md change before infrastructure lifecycle mutation. No other existing repository source/configuration file may change."
    - "DELETE AUTHORITY is exactly one container: agent-runtime-sentinel. Immediately before deletion, re-inspect that exact container and re-prove positive ownership and all sentinel-only safety predicates. Delete it exactly once. Do not delete by wildcard, prefix, Compose project, image, label selector, or bulk cleanup."
    - "CREATE AUTHORITY is exactly one container: agent-runtime. Recreate the sentinel with the existing official tiny image digest busybox@sha256:8d7b1636e974e0adfd8d945955fca609304f0a56c18799dfd032d6e661382d84 and inert main process sleep 2147483647. The final container must be detached, use Docker-native HEALTHCHECK command nc -z -w 2 host.docker.internal 8080 with 10s interval, 3s timeout, and 2 retries, publish no ports, mount nothing, contain no Docker socket/repository/host filesystem/secrets/credentials, run non-privileged, drop ALL Linux capabilities, set no-new-privileges=true, use a read-only root filesystem, limit CPUs to 0.05, memory to 16 MiB with memory-swap also 16 MiB, PIDs to 16, use restart policy unless-stopped, and perform no repair or lifecycle action."
    - "The final agent-runtime container labels must include at minimum: local.operator.agent-runtime.repository=phatnguyen03022001/agent-runtime; local.operator.agent-runtime.owner=operator; local.operator.agent-runtime.purpose=health-sentinel; local.operator.agent-runtime.lifecycle-authority=operator-only; local.operator.agent-runtime.protected=true; local.operator.agent-runtime.protected-port=8080. Do not copy the old sentinel label namespace as the canonical final namespace."
    - "After successful creation of agent-runtime, the one-time infrastructure lifecycle authority is exhausted immediately. From that point onward, perform only read-only inspection against containers, Runtime, tunnel, listener, images, and host processes. The only permitted post-creation mutation is protocol-required repository evidence publication for this already-authorized task; it grants no renewed infrastructure mutation authority."
    - "Post-creation read-only proof must show exactly one agent-runtime-owned persistent container, named agent-runtime; sentinel-only behavior; exact image digest/arm64; no published ports; no mounts; no Docker socket; no extra environment secrets; read-only rootfs; CapDrop ALL; no-new-privileges; non-privileged; exact CPU/memory/PID limits; unless-stopped; exact healthcheck target host.docker.internal:8080; current health consistent with port reachability; and the native macOS 127.0.0.1:8080 listener still present and was not restarted/replaced by task action. Do not stop Runtime to test the negative health case; prove the negative semantic from the exact nc healthcheck command and absence of auto-repair behavior."
    - "Read-only classify all other current containers by positive ownership as COMPLIANT, NAME_MISMATCH, MULTIPLE_PERSISTENT_CONTAINERS, UNKNOWN_OWNER, or UNRELATED_INFRASTRUCTURE. Record any non-agent-runtime finding as observation only. In particular, do not mutate ielts-runner-1, ielts-postgres-1, ielts-redis-1, any later ielts container, unknown container, unrelated container, or OrbStack-internal resource under this task. A separate repository binding/task is required for any future non-agent-runtime remediation."
    - "Run the repository-native bootstrap/profile verification that is applicable to the single ARCHITECT_PROFILE.md change, exact changed-path/diff checks, and git diff --check. Create only .agent/tasks/TASK-0045/report.yaml after all required runtime post-inspection and repository checks are complete. Set final_execution_head to the exact pre-report repository candidate, validate report structure with the selected agent-skills authority where supported, publish candidate then report non-force to dev, fresh-prove exact report-only direct-child lineage and unchanged main, and stop at NEEDS_REVIEW."
  allowed_existing_files_or_components:
    - "ARCHITECT_PROFILE.md"
    - ".agent/tasks/TASK-0045/report.yaml"
    - "local OrbStack container agent-runtime-sentinel (delete exactly once only after positive ownership proof)"
    - "local OrbStack container agent-runtime (create exactly once with the specified sentinel-only configuration)"
  expected_files_are_restrictive: true

invariants:
  - "Canonical steady-state invariant: ONE REPOSITORY -> <= 1 PERSISTENT CONTAINER -> EXACT GITHUB REPOSITORY BASENAME. A repository with zero persistent containers remains valid; this task never creates containers merely because a repository exists."
  - "Current required final container identity is exactly agent-runtime for repository phatnguyen03022001/agent-runtime."
  - "The container named agent-runtime remains a read-only health sentinel only. It does not host, proxy, supervise, restart, stop, signal, repair, expose, or own Agent Runtime."
  - "Agent Runtime remains native macOS. The secure tunnel and macOS listener on port 8080 remain operator-owned shared infrastructure."
  - "Runtime, tunnel, listener 8080, and final agent-runtime sentinel lifecycle authority are OPERATOR_ONLY after successful creation. Container naming is identity convention only and never grants lifecycle authority."
  - "Unknown or unrelated containers fail closed. Positive repository ownership proof is required before deletion; name similarity alone is insufficient."
  - "No second persistent agent-runtime container may remain after successful remediation."
  - "No task-owned temporary container may remain at terminal state. Native Docker tooling must not leave -test, -tmp, -old, -backup, -dev, -worker, -sentinel, or equivalent repo-owned leftovers."
  - "The durable rule exists only in architect-profile as operator configuration; agent-runtime source does not become the owner of generic repository-container naming policy."

forbidden_changes:
  - "Do not stop, restart, kill, signal, replace, proxy, move, rebind, or reconfigure native Agent Runtime, tunnel-client, secure tunnel, or the macOS port 8080 listener. Do not free port 8080."
  - "Do not stop, restart, remove, recreate, rename, or reconfigure the final agent-runtime container after its successful creation."
  - "Do not mutate any container other than deleting exactly agent-runtime-sentinel and creating exactly agent-runtime. No prune, system prune, container prune, rm by filter/prefix, Compose down, Compose rm, bulk stop, bulk restart, or image cleanup is authorized."
  - "Do not mutate ielts-runner-1, ielts-postgres-1, ielts-redis-1, phat-portfolio resources, unknown resources, unrelated infrastructure, OrbStack internals, or any repository other than architect-profile."
  - "Do not dockerize Agent Runtime, move Runtime into OrbStack, create a proxy/dashboard/monitor/watchdog/supervisor/daemon/controller/container manager/repo registry/service registry/database, introduce Kubernetes, or redesign into Docker Compose multi-container topology."
  - "Do not mount Docker socket, host filesystem, repository source, or credentials into the final sentinel; do not publish a port; do not add Runtime secrets."
  - "Do not modify agent-runtime source, agent-skills, agent-standards, agent-documents, target product repositories, bootstrap.json, authority.lock.json, ARCHITECT_CALIBRATION.md, README.md, workflows, dependencies, branch topology, or existing task/report/review artifacts."
  - "Do not pull/build/substitute an image if the exact authorized BusyBox digest is unavailable. Do not widen resource limits or add capabilities to work around a failure."
  - "Do not force-push, reset, rebase, merge, cherry-pick, create a branch, move main, create a tag/release, or claim ACCEPTED/stable activation."

