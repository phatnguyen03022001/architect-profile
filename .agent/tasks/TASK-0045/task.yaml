acceptance_criteria:
  - id: AC-1
    requirement: "OrbStack engine is freshly proven before mutation."
    evidence_required: "Exact docker context and docker info showing context orbstack and OperatingSystem OrbStack."
  - id: AC-2
    requirement: "agent-runtime-sentinel is positively proven to belong to phatnguyen03022001/agent-runtime before deletion."
    evidence_required: "Fresh exact container inspect showing operator ownership/purpose/protected-resource evidence, exact sentinel health target, and exact GitHub repository identity/basename mapping; ambiguity blocks deletion."
  - id: AC-3
    requirement: "The mismatched agent-runtime-sentinel container is removed exactly once."
    evidence_required: "Pre-delete exact identity plus post-delete absence proof, with no bulk deletion command or other removed container."
  - id: AC-4
    requirement: "Final persistent container name is exactly agent-runtime."
    evidence_required: "Post-creation docker inspect/ps exact name proof."
  - id: AC-5
    requirement: "No second persistent agent-runtime-owned container remains."
    evidence_required: "All-container post-audit plus positive ownership mapping shows exactly one agent-runtime-owned persistent container."
  - id: AC-6
    requirement: "Final container remains sentinel-only."
    evidence_required: "Exact image, command, healthcheck, labels, mounts, ports, environment, and process configuration show inert main process plus read-only port reachability probe only."
  - id: AC-7
    requirement: "Native Agent Runtime still runs on macOS and not inside the container."
    evidence_required: "Read-only host process/listener evidence plus final container command/configuration."
  - id: AC-8
    requirement: "macOS port 8080 listener was not killed, restarted, or replaced by task action."
    evidence_required: "Pre/post read-only listener identity evidence; no task command may target its PID/process lifecycle."
  - id: AC-9
    requirement: "Sentinel probes only host.docker.internal:8080."
    evidence_required: "Exact Docker healthcheck command inspection."
  - id: AC-10
    requirement: "Final sentinel publishes no ports."
    evidence_required: "HostConfig/NetworkSettings published-port inspection is empty."
  - id: AC-11
    requirement: "Final sentinel has no mounts."
    evidence_required: "Mounts and bind/volume configuration are empty."
  - id: AC-12
    requirement: "Final sentinel has no Docker socket."
    evidence_required: "No mounts/binds/devices expose docker.sock or OrbStack socket."
  - id: AC-13
    requirement: "Final sentinel contains no secrets or credentials."
    evidence_required: "Exact environment and mount inspection shows only image defaults and no task-added secrets/credentials."
  - id: AC-14
    requirement: "Final sentinel root filesystem is read-only."
    evidence_required: "ReadonlyRootfs=true."
  - id: AC-15
    requirement: "All Linux capabilities are dropped."
    evidence_required: "CapDrop contains ALL and CapAdd is empty."
  - id: AC-16
    requirement: "no-new-privileges is enabled."
    evidence_required: "SecurityOpt contains no-new-privileges=true and Privileged=false."
  - id: AC-17
    requirement: "CPU, memory, swap, and PIDs are bounded exactly as authorized."
    evidence_required: "NanoCpus=50000000, Memory=16777216, MemorySwap=16777216, and PidsLimit=16."
  - id: AC-18
    requirement: "Restart policy is unless-stopped."
    evidence_required: "Exact RestartPolicy inspection."
  - id: AC-19
    requirement: "Final health reflects port reachability only: Runtime reachable yields HEALTHY; unreachable would yield UNHEALTHY; no auto-repair exists."
    evidence_required: "Current healthy state while 8080 is reachable plus exact nc healthcheck exit semantics, inert main process, and absence of repair/lifecycle hooks. Do not stop Runtime for negative testing."
  - id: AC-20
    requirement: "Final agent-runtime container is labeled operator-owned, protected, operator-only lifecycle, repository-bound, and protected-port 8080."
    evidence_required: "Exact required namespaced label key/value inspection."
  - id: AC-21
    requirement: "After successful creation, no further operator-infrastructure mutation occurs."
    evidence_required: "Post-creation command evidence contains only read-only inspection of containers/Runtime/tunnel/listener/images/processes; any later repository-only report publication must not invoke infrastructure lifecycle commands."
  - id: AC-22
    requirement: "Repository source changes are limited to the separately proven canonical owner change in ARCHITECT_PROFILE.md plus task report evidence."
    evidence_required: "Exact changed-path/diff proof and repository verification; no agent-runtime or other repository source changes."
  - id: AC-23
    requirement: "No unrelated container is touched."
    evidence_required: "Pre/post all-container identity comparison and exact command log/bounded execution evidence."
  - id: AC-24
    requirement: "No orchestration, controller, supervisor, monitoring framework, registry, or other new machinery is introduced."
    evidence_required: "Repository diff plus final container topology/configuration show one tiny sentinel replacement and one compact profile rule only."
  - id: AC-25
    requirement: "The durable operator rule is stored in exactly one narrow canonical owner and is reconstructible by fresh Architects without loading historical task chat."
    evidence_required: "ARCHITECT_PROFILE.md contains the compact repository-container identity subsection; agent-skills, agent-standards, agent-documents, and agent-runtime source are unchanged."
  - id: AC-26
    requirement: "Global audit findings outside agent-runtime are observation-only in this task."
    evidence_required: "Report classifies all current positively mapped containers and confirms zero non-agent-runtime lifecycle mutation."

