invariants:
  - "Final architecture: Agent Runtime remains native macOS; final OrbStack agent-runtime is a health/status sentinel only."
  - "Canonical container identity: ONE REPOSITORY -> <= 1 PERSISTENT CONTAINER -> EXACT GITHUB REPOSITORY BASENAME."
  - "Protected resources are native Agent Runtime, secure tunnel, macOS listener on port 8080, and final agent-runtime container. Lifecycle authority for all is OPERATOR_ONLY; agents have INSPECT_AND_USE_ONLY authority."
  - "Runtime/tunnel/8080 lifecycle authority is never granted to Executor. The only temporary lifecycle grant is delete agent-runtime-sentinel once and create agent-runtime once."
  - "Runtime unavailable means REPORT ONLY. No auto-restart, auto-repair, or recovery is authorized."
  - "Port 8080 is reserved operator infrastructure. A target task that conflicts must choose another port."
  - "Preserving the currently running Runtime/tunnel session is a hard requirement; verification, cleanup, health testing, deployment, and convenience never justify restart."
  - "The final sentinel has no Docker/OrbStack control socket, no host/repo mount, no secrets, no privileges, no host-control bridge, and no Runtime lifecycle control path."
  - "Sentinel restart policy unless-stopped applies only to the sentinel itself and cannot trigger Runtime lifecycle action."
  - "Unknown/unrelated resources fail closed; no non-agent-runtime container lifecycle mutation is authorized."
  - "No custom supervisor, watchdog, daemon, controller, runtime manager, Docker manager, repo worker, scheduler, registry, state database, dashboard, monitoring framework, API wrapper, or equivalent abstraction is introduced."
  - "OrbStack is not an authorized Runtime lifecycle controller and this task must not claim it can safely start native Agent Runtime under these constraints."

forbidden_changes:
  - "Do not start, stop, restart, kill, signal, replace, proxy, move, rebind, repair, or reconfigure native Agent Runtime, tunnel-client, secure tunnel, or macOS port 8080 listener; never free port 8080."
  - "Do not stop, restart, remove, recreate, rename, exec-control, or reconfigure final agent-runtime after successful creation."
  - "Do not mutate any container other than deleting exactly agent-runtime-sentinel and creating exactly agent-runtime. No prune, bulk cleanup, Compose lifecycle, prefix/filter removal, image cleanup, or unrelated container lifecycle command is authorized."
  - "Do not use kill/pkill/killall, lsof-to-kill, broad PGID/process-tree cleanup, or equivalent cleanup if it can reach protected resources."
  - "Do not mount docker.sock, OrbStack control sockets, host filesystem, repository source, Runtime files, secrets, or credentials; do not add devices, privileges, capabilities, published ports, host-control bridges, or lifecycle hooks."
  - "Do not dockerize Agent Runtime or create a proxy, supervisor, watchdog, daemon, controller, Runtime manager, Docker manager, repo worker, scheduler, registry, database, dashboard, monitoring framework, API wrapper, m3-repoworker-style abstraction, Kubernetes, or Compose redesign."
  - "Do not mutate ilets, phat-portfolio, any other repository/container, unknown resource, unrelated infrastructure, or OrbStack internals."
  - "Do not modify agent-runtime source, agent-skills, agent-standards, agent-documents, bootstrap.json, authority.lock.json, ARCHITECT_CALIBRATION.md, README.md, workflows, dependencies, branch topology, or historical report/review artifacts."
  - "Do not pull, build, or substitute an image if the exact pinned BusyBox digest is unavailable."
  - "Do not restart Runtime/tunnel to verify health, negative-path behavior, deployment, cleanup, or convenience. Repeated restart is treated as a session-continuity risk including possible 403/connection failure."
  - "Do not claim OrbStack can start native Agent Runtime unless independently proven under a future explicit operator authority; no such authority or mechanism exists in this task."
  - "Do not force-push, reset, rebase, merge, cherry-pick, create a branch, move main, create a tag/release, or claim ACCEPTED/stable activation."

