acceptance_criteria:
  - id: AC-1
    requirement: "Reusable governance that the profile explicitly defers to agent-skills is no longer redundantly defined at near-contract depth in architect-profile."
    evidence_required: "Exact diff plus pinned agent-skills comparison identifies the deleted/derived generic semantics and shows any retained local prose has a concrete operator-specific reason."
  - id: AC-2
    requirement: "The taskless-DIRECT conflict is closed without creating a replacement bypass."
    evidence_required: "Final profile contains no authority claim that a DIRECT transient prompt may replace canonical task/handoff authority; any taskless mutation reference is limited to the current agent-skills micro-maintenance exception by reference rather than local redefinition."
  - id: AC-3
    requirement: "Operator-specific high-value behavior is preserved."
    evidence_required: "Final inspection confirms Terminal safety/local-root binding, secret non-disclosure, ROLE/WORK BOUNDARY and inert-marker semantics, current-GitHub bootstrap, TASK LAUNCH presentation/copy boundary, workstation/model/language/cost/human-in-loop preferences remain materially intact."
  - id: AC-4
    requirement: "Deferred-observation and `.env` sections are reduced to operator-specific responsibility without losing their intended safety boundary."
    evidence_required: "Final sections preserve operator continuity/secret invariants while no longer carrying unnecessary generic lifecycle/implementation recipes already owned elsewhere."
  - id: AC-5
    requirement: "Any multi-repository Executor convenience remains presentation/routing only."
    evidence_required: "If added, the final text is at most a concise preference referencing existing agent-skills sequential rebinding; it creates no shared authority, program state, transaction, lifecycle, or new named protocol mechanism."
  - id: AC-6
    requirement: "The cleanup is subtraction-first and bounded."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md and README.md only if concretely necessary; no unrelated semantics are added, no other repository is mutated, and exact final diff is reviewable as ownership/subtraction rather than a rewrite."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start refresh canonical GitHub truth and require main equals the exact handoff base, branches exactly {main}, TASK-0001 revision 1 resolves at that base, and pinned agent-skills fe3fd6de46c6e2220edbcadfb27f12c8dd23b2d6 is available. Preflight required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Before editing, read the exact current agent-skills owner sections for sequential Executor rebinding/PROGRAM, deferred observations, DIRECT/micro-maintenance, gap handling, verification governance, and stable change admission. Record which profile prose is externally derivable versus genuinely operator-specific."
      required: true
    - id: CHECK-3
      command_or_check: "Perform one bounded subtraction/reconciliation pass. Prefer deletion/short reference over paraphrased duplicate prose. Preserve every explicitly protected operator-specific invariant."
      required: true
    - id: CHECK-4
      command_or_check: "Inspect the exact final Markdown for internal contradictions, broken headings/code fences, stale local ownership claims, duplicated taskless-DIRECT authority, and accidental weakening of protected safety/presentation semantics."
      required: true
    - id: CHECK-5
      command_or_check: "Review the exact implementation diff against b9d9d8824ed278432a1266e81f8fb28ffe2e42d3 plus this planning commit. Prove all semantic additions/deletions are attributable to the authorized findings and that README is unchanged unless a concrete contradiction required it."
      required: true
    - id: CHECK-6
      command_or_check: "Commit/push the implementation non-force to main only after re-reading remote main and requiring it still equals the exact execution base. Do not create any branch."
      required: true
    - id: CHECK-7
      command_or_check: "Create .agent/tasks/TASK-0001/report.yaml with exact ownership-comparison, preservation, diff, Git-action, and final-ref evidence. Commit/push it separately, then verify its sole parent is the implementation commit, its diff is report-only, main equals the report commit, and branches remain exactly {main}."
      required: true
  authoritative_verification:
    required: true
    mechanism: "Exact pinned-owner comparison + final Markdown semantic/diff inspection"
    expected_signal: "All AC-1..AC-6 PROVEN with no protected invariant weakened and no unowned governance expansion"

