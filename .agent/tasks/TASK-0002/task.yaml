authority_sources:
  - source: "Current informed operator decision to trust ChatGPT as the operator agent and treat a directly available normal Mac Terminal/local shell as a generic engineering capability rather than requiring command-specific primitives."
    role: "Durable operator-specific trust-model and machine-policy change."
    precedence: 1
