acceptance_criteria:
  - id: AC-1
    requirement: "Directly available trusted Terminal/local shell is represented as a normal operator-approved engineering capability without becoming authority or requiring manual operator bridging."
    evidence_required: "Final profile clearly permits direct agent use when capability is available, keeps manual Terminal fallback-only, and preserves authority/capability separation by reference to current agent-skills."
  - id: AC-2
    requirement: "Behavioral workspace/root semantics are precise and do not overclaim sandboxing."
    evidence_required: "Final text keeps `/Users/tienphat/Developer/` as assistant-selected persistent-work root, exact target binding for repository work, incidental OS/tool access distinction, and explicitly rejects mechanical-sandbox claims absent enforcement."
  - id: AC-3
    requirement: "One simple workspace-level scratch convention exists without becoming a subsystem."
    evidence_required: "Final text uses exactly `/Users/tienphat/Developer/.agent-scratch/`, defines disposable/reference uses and non-authority/non-secret semantics, and introduces no registry/schema/daemon/placeholder machinery."
  - id: AC-4
    requirement: "Safety remains consequence-based and practical."
    evidence_required: "Final profile keeps investigation comparatively loose, persistent target mutation authority-bound, and consequential loss/overwrite/publish/external/irreversible/divergence actions protected by fresh state/identity checks without command-name governance."
  - id: AC-5
    requirement: "Existing high-value operator safeguards remain intact."
    evidence_required: "Exact final inspection confirms secret discipline, exact repo/remote binding, sibling isolation, dirty/local-divergence safeguards, GitHub canonical truth, ROLE/WORK BOUNDARY, TASK LAUNCH, bootstrap/current-profile identity, and language semantics are not materially weakened."
  - id: AC-6
    requirement: "The change is bounded and does not prejudge runtime deletion."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md and README only if concretely necessary; agent-runtime and all other repos remain untouched; no new mechanism/subsystem is created; final report is separate and main-only topology remains exact."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "At execution start refresh canonical GitHub truth and require main equals the exact handoff base, branches exactly {main}, TASK-0002 revision 1 resolves at that base, and pinned agent-skills 0f2060cb027b5cc7e5abe29252c87b822e08a2f2 is available. Preflight all required EXECUTION capabilities before mutation."
      required: true
    - id: CHECK-2
      command_or_check: "Read exact current ARCHITECT_PROFILE.md plus the accepted TASK-0009 generic semantics from pinned agent-skills. Identify only operator-specific clauses that need reconciliation and preserve all unrelated accepted profile semantics."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest profile correction. Review specifically for manual-RPC residue, sandbox overclaim, sibling/scratch authority ambiguity, secret weakening, command-list governance, duplicate generic agent-skills semantics, or accidental runtime adjudication."
      required: true
    - id: CHECK-4
      command_or_check: "Inspect exact final Markdown and exact base-to-implementation diff for internal contradictions, broken headings/fences, ownership leakage, or weakening of protected operator safeguards. README must remain unchanged unless a concrete contradiction requires a minimal correction."
      required: true
    - id: CHECK-5
      command_or_check: "Commit/push implementation non-force to main only after fresh remote re-read proves main still equals the exact execution base. Do not create any branch."
      required: true
    - id: CHECK-6
      command_or_check: "Create .agent/tasks/TASK-0002/report.yaml with exact semantic, preservation, diff, and Git evidence. Commit/push it separately, then verify report sole parent is implementation commit, report diff is report-only, main equals report commit, and branches remain exactly {main}."
      required: true
  authoritative_verification:
    required: true
    mechanism: "exact pinned-owner comparison + final Markdown semantic/diff inspection"
    expected_signal: "AC-1..AC-6 proven with no sandbox overclaim, command-broker semantics, authority weakening, or runtime adjudication"

