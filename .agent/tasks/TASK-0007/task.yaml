structure_authority:
  status: RESOLVED
  source: "ARCHITECT_PROFILE.md current environment/execution/local-safety sections plus ARCHITECT_CALIBRATION.md maintenance rules."
  rationale: "This is a subtraction and abstraction-boundary correction in operator-specific Architect behavior. Terminal implementation details should not remain a large Architect-level governance surface when local execution is intended to be mediated by agent-runtime. No agent-runtime mutation is justified while Mac/local capability is currently dormant and untestable."

objective: >-
  Simplify the Architect execution model for the operator by making phone-only ChatGPT + GitHub the active/default operating posture, removing Terminal as a first-class Architect routing/governance surface, and reducing Mac/Codex/local specifics to dormant additive capabilities that are re-qualified only when the environment actually changes. Local shell/process/filesystem safety and execution implementation belong behind agent-runtime; if that abstraction later proves insufficient when Mac is available, repair agent-runtime then rather than retaining duplicated Terminal doctrine in architect-profile.

scope:
  required_changes:
    - "Update ARCHITECT_PROFILE.md by coherent subtraction/merge, not additive doctrine. Remove Terminal from the set of Architect-selected execution surfaces and from normal routing/escalation language."
    - "Replace direct Terminal/local-shell routing semantics with one compact local-execution abstraction: Architect may select a currently proven local execution capability when materially needed; agent-runtime owns HOW local shell/process/filesystem execution is implemented and bounded."
    - "Remove or substantially collapse the large Local Terminal safety policy, exact local path/scratch/command mechanics, and other shell-implementation details that no longer belong in Architect-level behavior. Preserve only the minimum operator-specific invariant needed at this owner: local execution never changes GitHub SSOT/governance and must prove exact target/state/capability before consequential mutation."
    - "Treat current operating posture as phone-first: ChatGPT Architect + ChatGPT Executor + GitHub SSOT, with GitHub Actions or other current remote proof surfaces only when they are currently ENABLED/TRIGGERABLE and materially justified."
    - "Mac, Codex and agent-runtime are dormant optional capabilities while the operator is phone-only. Do not make current work depend on them and do not probe them merely to rediscover unavailability."
    - "Do not make the temporary absence of Mac/Codex/runtime a permanent product claim. Preserve capability-freshness semantics: when the environment materially changes, re-evaluate only the needed capabilities from current evidence."
    - "When Mac/local capability becomes relevant again, require a bounded qualification of agent-runtime against the task-required local capabilities rather than restoring Terminal as an Architect surface. If a material capability is missing, the resulting gap belongs to agent-runtime unless evidence proves another owner."
    - "Preserve Codex as an optional Executor only when currently exposed and useful; do not discuss or route to it during known phone-only operation unless the environment changes or the operator explicitly asks. Preserve the existing conditional model/effort preference without claiming availability."
    - "Preserve existing capability epistemics from TASK-0006: current evidence over remembered availability, CONFIRMED/INFERRED/HIDDEN and PRESENT->CONFIGURED->ENABLED->TRIGGERABLE->EXECUTED->PROVEN_PASS."
    - "Preserve mobile as first-class and low-human-in-loop. Do not replace removed Terminal doctrine with operator copy/paste command rituals. Physical/manual operator action remains fallback only when it is genuinely user-only and cannot be automated by an authorized current surface."
    - "Audit ARCHITECT_CALIBRATION.md for whether one concise abstraction/subtraction lesson is materially useful. Prefer revising/merging an existing capability-routing case over adding a new case. Leave calibration unchanged if profile-level correction is sufficient."
    - "Keep README.md unchanged unless the execution-surface summary becomes materially stale."
    - "Keep main-only topology and publish one bounded implementation commit followed by one report-only commit, then stop at Governing Architect review."

  allowed_existing_files_or_components:
    - ARCHITECT_PROFILE.md
    - ARCHITECT_CALIBRATION.md
    - README.md
    - .agent/tasks/TASK-0007/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "Architect remains ChatGPT; GitHub remote remains canonical repository truth."
  - "Exactly two organizational roles remain Architect and Executor."
  - "Phone-only work remains capable of planning, task authority, review, evidence analysis and bounded GitHub execution when current capabilities permit."
  - "Terminal is not a repository/task/governance authority and after this correction is not a first-class Architect routing surface."
  - "Local execution is optional/additive and never changes canonical authority."
  - "agent-runtime owns local execution implementation details when that capability is in use; architect-profile owns only operator-specific selection/behavior boundaries."
  - "No claim is made that agent-runtime is currently sufficient for future Mac work without evidence."
  - "No Mac/Codex/runtime probe is required in the current phone-only environment."
  - "Repository topology remains exactly {main}."

forbidden_changes:
  - "Do not modify agent-runtime, agent-skills, agent-standards, agent-documents, IELTS, or any other repository."
  - "Do not test Mac, local shell, tunnel, Codex or agent-runtime in the current phone-only environment."
  - "Do not create a new local-execution framework, terminal wrapper, capability registry, environment matrix, probe suite, shell policy file, runtime database or control plane."
  - "Do not preserve Terminal doctrine merely as fallback documentation. If future agent-runtime qualification exposes a real missing capability, record and repair that gap then."
  - "Do not hard-code temporary session availability or claim Mac/Codex/runtime are permanently unavailable."
  - "Do not replace Terminal with another implementation-specific shell/tool name in Architect routing."
  - "Do not weaken exact target binding, mutation authority, secret boundaries, evidence requirements or GitHub SSOT semantics."
  - "Do not perform unrelated profile cleanup."

