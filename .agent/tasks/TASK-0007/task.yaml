acceptance_criteria:
  - id: AC-1
    requirement: "Terminal is removed from the Architect execution model without losing necessary governance invariants."
    evidence_required: "Profile no longer routes Architect/Executor work to Terminal or preserves a large Terminal-specific safety policy; exact target/state/authority/evidence boundaries remain intact at the appropriate abstraction level."
  - id: AC-2
    requirement: "Local execution ownership is clean."
    evidence_required: "Profile states what the Architect may require from local execution and delegates HOW shell/process/filesystem execution is implemented to agent-runtime, without claiming current future sufficiency."
  - id: AC-3
    requirement: "Phone-only is the active/default posture without becoming a false permanent capability claim."
    evidence_required: "Profile supports ChatGPT + GitHub as the current first-class path, avoids dormant-surface probing, and reuses capability freshness when the environment later changes."
  - id: AC-4
    requirement: "Mac/Codex/runtime dormancy does not contaminate current routing."
    evidence_required: "Known phone-only operation does not trigger Mac/Codex/runtime probing or recommendations; optional capabilities are reconsidered only after material environment change or explicit operator request."
  - id: AC-5
    requirement: "Subtraction reduces profile complexity."
    evidence_required: "Net execution-environment/local-safety doctrine is materially smaller or simpler; no replacement framework, registry, matrix or shell-specific policy is introduced."
  - id: AC-6
    requirement: "Existing Fellow-level behavior from TASK-0006 survives."
    evidence_required: "Capability freshness, epistemic labels, execution evidence ladder, NEEDS_REVIEW priority, audit triggers, low-human-in-loop and successor-convergence semantics remain materially intact."
  - id: AC-7
    requirement: "Change remains correctly owned and bounded."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md plus calibration/README only if strictly needed; no cross-repo mutation; report is a separate child; topology remains {main}."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh architect-profile/main; require exact handoff base and topology {main}; resolve TASK-0007 revision 1 and agent-skills pin 533eaef0dbed13c5bbfdad1195218d8382a38e5c."
      required: true
    - id: CHECK-2
      command_or_check: "Read the complete current environment/execution/local-safety sections and identify every Terminal-first, direct-shell, exact-local-path, scratch, manual-command or Mac/Codex routing rule whose implementation detail should leave Architect-level ownership."
      required: true
    - id: CHECK-3
      command_or_check: "Rewrite by subtraction: preserve only current phone-first routing, capability freshness, local-execution selection invariants, agent-runtime ownership boundary and future requalification rule. Do not merely append a deprecation paragraph above stale Terminal doctrine."
      required: true
    - id: CHECK-4
      command_or_check: "Adversarial semantic review: Terminal is not first-class; no manual-command loop is reintroduced; GitHub SSOT and exact authority remain; phone-only work is sufficient for current governance; dormant Mac/Codex/runtime are not probed; future local gaps route to agent-runtime; TASK-0006 convergence/capability semantics remain intact."
      required: true
    - id: CHECK-5
      command_or_check: "Measure subtraction qualitatively and by diff: execution/local-safety wording must be materially simplified, not expanded into an equivalent replacement framework. Calibration should be revised only if it reduces ambiguity or duplication."
      required: true
    - id: CHECK-6
      command_or_check: "Before each write refresh main and require exact expected parent. Verify implementation diff is bounded to allowed profile/calibration/optional README changes and contains no runtime/cross-repository artifact."
      required: true
    - id: CHECK-7
      command_or_check: "Publish one implementation commit non-force to main; create TASK-0007/report.yaml as one separate report-only child; verify exact lineage/final main/topology and stop at Governing Architect review."
      required: true
  authoritative_verification:
    required: false
    mechanism: "semantic subtraction review against TASK-0007 acceptance criteria"
    expected_signal: "smaller Architect execution model with Terminal abstracted behind agent-runtime and phone-first behavior preserved"

