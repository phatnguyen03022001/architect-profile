authority_sources:
  - source: "Explicit operator decision in current Architect context"
    role: "Durable operator objective: architecture/design is completed to high-standard closure before production implementation; minimum docs means minimum representation with complete material decision coverage, and production implementation begins only after explicit operator documentation lock."
    precedence: 1
  - source: "phatnguyen03022001/architect-profile@fefd4f8b7b7fa965524b42ff8a42087609936388"
    role: "Current profile subject whose docs-first wording is materially too weak and permits successor Architects to infer just-enough-design-per-slice."
    precedence: 2
  - source: "phatnguyen03022001/agent-skills@33f138c56dee6a2a1e8b8a6dc52b1399452ef177"
    role: "Reusable task-governance authority; operator-specific doctrine remains owned by architect-profile rather than duplicated into generic protocol."
    precedence: 3

structure_authority:
  status: RESOLVED
  source: "ARCHITECT_PROFILE.md existing Sections 3, 12, 13, and 16 only."
  rationale: "This is an operator-profile semantic correction. No new document, workflow engine, lifecycle artifact, or cross-repository governance mechanism is justified."

objective: "Make the operator's architecture-first documentation gate unambiguous for successor Architects: design the material architecture/system constraints to closure before production implementation, keep the canonical documentation surface minimal and ownership-driven while covering every material implementation-driving gap, require explicit operator documentation lock before production implementation begins, and keep post-lock features evolutionary/customer-driven inside those locked architectural constraints."

scope:
  required_changes:
    - "Update ARCHITECT_PROFILE.md so 'minimum docs' is explicitly minimum representation, duplication, and ceremony, not minimum semantic/design coverage. Canonical docs must answer every material implementation-driving question within the intended project/milestone scope before production implementation begins."
    - "Clarify the operator's preferred sequence: architecture/design authority is developed to closure first; documentation closure/readiness evidence alone does not authorize implementation; explicit operator documentation lock is the implementation gate."
    - "Clarify that before lock, production implementation is frozen. Read-only investigation, research, verification, and disposable prototypes/reproductions may be used to inform design but must not silently become canonical product behavior or implementation authority."
    - "Clarify that architecture/system constraints are held to a high standard before implementation, while product features remain evolutionary and customer/user-driven after lock when they stay inside the locked architecture. A material feature change that creates or crosses an architectural/design gap reopens the relevant canonical docs before implementation continues."
    - "Preserve anti-overplanning guidance, but make clear that avoiding endless planning does not authorize code-first or just-enough-design-per-slice when material project-level design gaps remain unresolved."
    - "Preserve the documentation-boundary preference: few canonical owners, high information density, low duplication, no mega-file owning unrelated responsibilities, and split/shard by semantic ownership rather than arbitrary size."
    - "Where agent-documents is adopted by a target, treat its closure/readiness result as evidence of documentation closure only; do not duplicate its taxonomy/model in this profile and do not reinterpret DOCS_READY as execution authority."
    - "Do not modify README.md, .agent/tasks/TASK-0001 through TASK-0003, agent-skills, agent-documents, agent-standards, agent-runtime, or any target product repository."
    - "Produce TASK-0004/report.yaml in a separate report-only commit and stop at Governing Architect review."

  allowed_existing_files_or_components:
    - ARCHITECT_PROFILE.md
    - .agent/tasks/TASK-0004/task.yaml
  expected_files_are_restrictive: true

invariants:
  - "architect-profile remains the sole owner of this operator-specific preference; reusable documentation taxonomy/closure semantics remain in agent-documents and generic work governance remains in agent-skills."
  - "GitHub remains canonical repository truth."
  - "KISS remains required: minimum unnecessary complexity, not minimum architectural rigor."
  - "LOCK ARCHITECTURE does not mean FREEZE PRODUCT; post-lock features may evolve within the locked constraints."
  - "No profile wording may imply that structural documentation readiness is itself mutation/execution authority."
  - "Repository topology remains exactly {main}."

forbidden_changes:
  - "Do not modify any file other than ARCHITECT_PROFILE.md and the new TASK-0004/report.yaml."
  - "Do not add a new document, phase registry, lock file, state machine, workflow engine, readiness database, scorecard, checklist subsystem, or framework layer."
  - "Do not copy the agent-documents concern taxonomy or validator semantics into architect-profile."
  - "Do not change reusable agent-skills protocol semantics or agent-standards claim/evidence semantics."
  - "Do not turn feature evolution into upfront exhaustive feature specification; the lock concerns material architecture/design constraints and the project/milestone questions necessary to implement without architectural guessing."
  - "Do not perform unrelated profile cleanup or wording modernization."

gap_policy:
  local_auto_fix: true
  scope_expansion: forbidden
  architecture_change: forbidden
  spec_change: forbidden
  dependency_change: forbidden
  public_contract_change: revised_contract_required
  blocking_gap_behavior: BLOCKED

structure_policy:
  expected_new_files:
    - .agent/tasks/TASK-0004/report.yaml
  unlisted_new_files:
    allowed: false
    max: 0
    within: []
    purpose: ""
  allow_new_top_level_directories: false
  allow_new_shared_modules: false

continuation_policy:
  mode: MANUAL
  stop_conditions:
    - BLOCKED
    - STALE_STATE
    - AUTHORITY_REQUIRED
    - CURRENT_PHASE_CAPABILITY_UNAVAILABLE
    - REVIEW_REQUIRED
    - REVERIFY_REQUIRED
    - USER_STOP

capability_requirements:
