    - exact_remote_ref_read
    - repository_content_read
    - repository_content_write
  REVIEW:
    - exact_commit_report_resolution
    - repository_content_write

acceptance_criteria:
  - id: AC-1
    requirement: "A fresh successor Architect cannot reasonably infer just-enough-design-per-slice as this operator's default pre-implementation model."
    evidence_required: "ARCHITECT_PROFILE.md explicitly distinguishes minimum representation from complete material decision coverage and requires architecture/design closure before production implementation."
  - id: AC-2
    requirement: "The implementation gate is explicit."
    evidence_required: "Profile distinguishes documentation readiness/closure from explicit operator lock and states that production implementation does not begin before that lock."
  - id: AC-3
    requirement: "High architectural rigor and feature evolution are both preserved."
    evidence_required: "Profile states architecture/system constraints are designed to high standard before implementation while customer/user-driven features may evolve after lock inside those constraints; architectural crossings reopen docs."
  - id: AC-4
    requirement: "Minimal documentation surface remains a first-class constraint."
    evidence_required: "Profile preserves few canonical owners, high information density, low duplication, and ownership-based sharding while rejecting mega-doc and one-file-per-thought failure modes."
  - id: AC-5
    requirement: "Ownership remains clean."
    evidence_required: "No agent-documents taxonomy, agent-standards semantics, or generic agent-skills protocol is redefined; only operator-specific doctrine is added."
  - id: AC-6
    requirement: "Execution is bounded and repository-local."
    evidence_required: "Implementation changes only ARCHITECT_PROFILE.md; report is a separate report-only child; topology remains {main}."

verification:
  executor_checks:
    - id: CHECK-1
      command_or_check: "Refresh canonical GitHub truth; require main equals exact handoff base and topology exactly {main}; resolve TASK-0004 revision 1 and pinned agent-skills revision; preflight required EXECUTION capabilities."
      required: true
    - id: CHECK-2
      command_or_check: "Inspect current Sections 3, 12, 13, and 16 and identify the exact ambiguity that currently permits just-enough-design-per-slice interpretation."
      required: true
    - id: CHECK-3
      command_or_check: "Implement the smallest coherent wording correction in ARCHITECT_PROFILE.md only; prefer subtraction/replacement over duplicated doctrine."
      required: true
    - id: CHECK-4
      command_or_check: "Semantic review: verify explicit pre-code closure + operator-lock gate, minimum-representation/complete-coverage distinction, architecture-vs-feature evolution boundary, reopening rule, and ownership preservation."
      required: true
    - id: CHECK-5
      command_or_check: "Verify exact implementation diff touches only ARCHITECT_PROFILE.md, contains no new framework/state machinery, and introduces no contradiction with existing GitHub canonical truth, KISS, or documentation-boundary preferences."
      required: true
    - id: CHECK-6
      command_or_check: "Commit/push implementation non-force to main after fresh exact-parent check; then create TASK-0004/report.yaml as a separate report-only commit, verify sole parent/diff/final main/topology, and stop at Governing Architect review."
      required: true
  authoritative_verification:
